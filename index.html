<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TASO 考勤管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS (xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root">
    <div style="padding: 40px; text-align: center; font-family: sans-serif; color: #64748b;">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 32px; color: #2563eb; margin-bottom: 12px;"></i>
      <p>TASO 系統正在初始化渲染，請稍候...</p>
    </div>
  </div>

  <!-- 全域錯誤防護：若發生異常直接顯示在畫面上，避免白畫面 -->
  <script>
    window.addEventListener('error', function(e) {
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = `<div style="padding: 30px; margin: 20px; background: #fef2f2; border: 1px solid #f87171; border-radius: 12px; color: #991b1b; font-family: sans-serif;">
          <h3 style="font-weight: bold; margin-bottom: 8px;"><i class="fa-solid fa-triangle-exclamation"></i> 系統渲染發生錯誤</h3>
          <p style="font-size: 13px; font-family: monospace; background: #fee2e2; padding: 10px; border-radius: 6px;">${e.message} (Line: ${e.lineno})</p>
        </div>`;
      }
    });
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyBXP4CNwWs905l7FG4lHMR1CsmZJJAv660",
      authDomain: "attendance-function-test1.firebaseapp.com",
      databaseURL: "https://attendance-function-test1-default-rtdb.firebaseio.com",
      projectId: "attendance-function-test1",
      storageBucket: "attendance-function-test1.firebasestorage.app",
      messagingSenderId: "276967647153",
      appId: "1:276967647153:web:6845f5fd391a26e0f63f90",
      measurementId: "G-0KF2L00BJK"
    };

    let auth = null;
    let db = null;
    let isFirebaseConfigured = false;

    try {
      if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        auth = firebase.auth();
        db = firebase.firestore();
        isFirebaseConfigured = true;
      }
    } catch (e) {
      console.warn("Firebase 初始化異常，使用本地展示模式。");
    }

    function getDayOfWeekStr(dateStr) {
      if (!dateStr) return '';
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? '' : `星期${days[d.getDay()]}`;
    }

    function calculateSeniority(onboardDateStr) {
      if (!onboardDateStr) return { str: '未提供', totalMonths: 0 };
      const start = new Date(onboardDateStr);
      const now = new Date();
      if (isNaN(start.getTime())) return { str: '無效日期', totalMonths: 0 };

      let years = now.getFullYear() - start.getFullYear();
      let months = now.getMonth() - start.getMonth();
      let days = now.getDate() - start.getDate();

      if (days < 0) {
        months -= 1;
        const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        days += prevMonthLastDay;
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      const totalMonths = Math.max(0, years * 12 + months);
      return {
        str: `${years > 0 ? years + ' 年 ' : ''}${Math.max(0, months)} 個月 ${Math.max(0, days)} 天`,
        totalMonths
      };
    }

    function calculateAnnualLeaveHours(onboardDateStr) {
      const { totalMonths } = calculateSeniority(onboardDateStr);
      if (totalMonths < 6) return 0;
      if (totalMonths < 12) return 3 * 8;
      if (totalMonths < 24) return 7 * 8;
      if (totalMonths < 36) return 10 * 8;
      if (totalMonths < 48) return 14 * 8;
      if (totalMonths < 60) return 15 * 8;
      const years = Math.floor(totalMonths / 12);
      const days = Math.min(15 + (years - 5), 30);
      return days * 8;
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('profile');

      const [loginClockId, setLoginClockId] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [showLoginPassword, setShowLoginPassword] = useState(false);
      const [loginError, setLoginError] = useState('');
      const [toastMessage, setToastMessage] = useState(null);

      const [usersList, setUsersList] = useState(() => {
        const saved = localStorage.getItem('taso_users_list');
        if (saved) { try { return JSON.parse(saved); } catch (e) {} }
        return [
          { 
            id: 'admin_1', 
            clockId: 'TASO00', 
            name: 'TEST', 
            title: '執行長／團長',
            gender: 'male', 
            password: 'Aa123456', 
            role: 'admin', 
            delegatedScopes: { leave: true, overtime: true, outing: true, holidays: true }
          }
        ];
      });

      const [holidaysList, setHolidaysList] = useState(() => {
        const saved = localStorage.getItem('taso_holidays_list');
        if (saved) { try { return JSON.parse(saved); } catch(e){} }
        return [];
      });

      useEffect(() => {
        localStorage.setItem('taso_users_list', JSON.stringify(usersList));
      }, [usersList]);

      useEffect(() => {
        localStorage.setItem('taso_holidays_list', JSON.stringify(holidaysList));
      }, [holidaysList]);

      const [leaveRequests, setLeaveRequests] = useState([]);
      const [overtimeRequests, setOvertimeRequests] = useState([]);
      const [outingRequests, setOutingRequests] = useState([]);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4000);
      };

      useEffect(() => {
        const savedClockId = localStorage.getItem('taso_login_clockId');
        if (savedClockId) {
          const matched = usersList.find(u => u.clockId === savedClockId);
          if (matched) {
            setCurrentUser(matched);
            setUserProfile(matched);
          }
        }
        setLoading(false);
      }, [usersList]);

      const monthlyStats = useMemo(() => {
        if (!userProfile) return { leaveHours: 0, otHours: 0, annualRemaining: 0, annualTotal: 0 };
        const currentMonthPrefix = new Date().toISOString().substring(0, 7);

        const monthLeaves = leaveRequests.filter(r => r.userId === userProfile.id && r.status === 'approved' && r.date.startsWith(currentMonthPrefix));
        const leaveHours = monthLeaves.reduce((sum, r) => sum + Number(r.hours || 0), 0);

        const monthOts = overtimeRequests.filter(r => r.userId === userProfile.id && r.finalApprovalStatus === 'approved' && r.date.startsWith(currentMonthPrefix));
        const otHours = monthOts.reduce((sum, r) => sum + Number(r.actualHours || r.planHours || 0), 0);

        const annualTotal = calculateAnnualLeaveHours(userProfile.onboardDate);
        const usedAnnual = leaveRequests.filter(r => r.userId === userProfile.id && r.status === 'approved' && r.leaveType === '特休').reduce((sum, r) => sum + Number(r.hours || 0), 0);
        const annualRemaining = Math.max(0, annualTotal - usedAnnual);

        return { leaveHours, otHours, annualRemaining, annualTotal };
      }, [userProfile, leaveRequests, overtimeRequests]);

      const handleLoginSubmit = (e) => {
        e?.preventDefault();
        setLoginError('');
        const trimmedClockId = loginClockId.trim().toUpperCase();
        const matchedUser = usersList.find(u => u.clockId.toUpperCase() === trimmedClockId);
        if (!matchedUser) {
          setLoginError('找不到該打卡機代號，請聯繫管理者！');
          return;
        }
        if (matchedUser.password && matchedUser.password !== loginPassword) {
          setLoginError('密碼不正確！');
          return;
        }
        setCurrentUser(matchedUser);
        setUserProfile(matchedUser);
        localStorage.setItem('taso_login_clockId', matchedUser.clockId);
        setActiveTab('profile');
        triggerToast(`歡迎回來，${matchedUser.name}！`);
      };

      const handleLogout = () => {
        localStorage.removeItem('taso_login_clockId');
        setCurrentUser(null);
        setUserProfile(null);
        setLoginClockId('');
        setLoginPassword('');
      };

      if (loading) {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-100">
            <div className="text-center">
              <i className="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-3"></i>
              <p className="text-slate-600 font-medium">TASO 系統載入中，請稍候...</p>
            </div>
          </div>
        );
      }

      if (!currentUser || !userProfile) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
              <div className="text-center mb-6">
                <div className="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl shadow-lg shadow-blue-200">
                  <i className="fa-solid fa-clock-rotate-left"></i>
                </div>
                <h2 className="text-2xl font-black text-slate-800 tracking-tight">TASO 考勤管理系統</h2>
                <p className="text-xs text-slate-500 mt-1 font-medium">企業電子考勤、休假與加班線上審核平台</p>
                <div className="mt-3 inline-flex items-center gap-1.5 px-3 py-1 bg-emerald-50 text-emerald-700 rounded-full text-xs font-bold border border-emerald-200">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span>{isFirebaseConfigured ? 'Firebase 雲端連線正常' : '本地展示模式'}</span>
                </div>
              </div>

              {loginError && (
                <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg flex items-center gap-2">
                  <i className="fa-solid fa-circle-exclamation text-base"></i>
                  <span>{loginError}</span>
                </div>
              )}

              <form onSubmit={handleLoginSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">打卡機帳號 (Clock ID)</label>
                  <input type="text" required placeholder="例如: TASO00" value={loginClockId} onChange={e => setLoginClockId(e.target.value)} className="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800 font-semibold" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">登入密碼</label>
                  <div className="relative">
                    <input type={showLoginPassword ? "text" : "password"} required placeholder="請輸入密碼" value={loginPassword} onChange={e => setLoginPassword(e.target.value)} className="w-full px-4 py-2.5 pr-12 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800" />
                    <button type="button" onClick={() => setShowLoginPassword(!showLoginPassword)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 px-2 py-1">
                      <i className={`fa-solid ${showLoginPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                    </button>
                  </div>
                </div>
                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md shadow-blue-200 flex items-center justify-center gap-2 mt-2">
                  <i className="fa-solid fa-right-to-bracket"></i> 登入考勤系統
                </button>
                <div className="p-3 bg-slate-50 rounded-xl text-xs text-slate-500 text-center space-y-1 border border-slate-200">
                  <p className="font-bold text-slate-700">預設管理員帳號：</p>
                  <p>帳號: <span className="font-mono font-bold text-blue-600">TASO00</span> | 密碼: <span className="font-mono font-bold text-blue-600">Aa123456</span></p>
                </div>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col relative bg-slate-50">
          <div className="bg-slate-900 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <i className="fa-solid fa-clock-rotate-left text-blue-400 text-xl"></i>
                <span className="font-bold text-lg tracking-wide">TASO 考勤管理系統</span>
                <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${
                  userProfile.role === 'admin' ? 'bg-red-500 text-white' : 'bg-slate-700 text-slate-300'
                }`}>
                  {userProfile.role === 'admin' ? '系統管理者' : '一般員工'}
                </span>
              </div>
              
              <div className="flex items-center gap-4">
                <span className="text-sm text-slate-200 font-semibold">
                  <i className="fa-solid fa-circle-user text-blue-400 mr-1.5"></i>
                  {userProfile.name}
                </span>
                <button onClick={handleLogout} className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition border border-slate-700 font-medium">
                  登出
                </button>
              </div>
            </div>
          </div>

          <div className="p-6 max-w-7xl mx-auto w-full space-y-6">
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
              <div>
                <h3 className="text-xl font-black text-slate-800">歡迎回來，{userProfile.name} ({userProfile.title || '員工'})！</h3>
                <p className="text-xs text-slate-500 mt-1">目前身份：<span className="font-bold text-blue-600">{userProfile.role === 'admin' ? '系統管理者' : '一般員工'}</span> | 雲端連線狀態：<span className="text-emerald-600 font-bold">連線正常</span></p>
              </div>
              <button onClick={() => alert('功能正常運作中！')} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-blue-700">
                <i className="fa-solid fa-check mr-1"></i> 系統狀態正常
              </button>
            </div>
          </div>

          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 text-xs font-bold">
              <i className="fa-solid fa-circle-check text-emerald-400 text-base"></i>
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
