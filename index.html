    function getDayOfWeekStr(dateStr) {
      if (!dateStr) return '';
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? '' : `星期${days[d.getDay()]}`;
    }

    function calculateSeniority(onboardDateStr) {
      if (!onboardDateStr) return { str: '未提供', totalMonths: 0 };
      const start = new Date(onboardDateStr);
      const now = new Date();
      if (isNaN(start.getTime())) return { str: '無效日期', totalMonths: 0 };

      let years = now.getFullYear() - start.getFullYear();
      let months = now.getMonth() - start.getMonth();
      let days = now.getDate() - start.getDate();

      if (days < 0) {
        months -= 1;
        const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        days += prevMonthLastDay;
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      const totalMonths = Math.max(0, years * 12 + months);
      return {
        str: `${years > 0 ? years + ' 年 ' : ''}${Math.max(0, months)} 個月 ${Math.max(0, days)} 天`,
        years,
        months,
        totalMonths
      };
    }

    function calculateAnnualLeaveHours(onboardDateStr) {
      const { totalMonths } = calculateSeniority(onboardDateStr);
      if (totalMonths < 6) return 0;
      if (totalMonths < 12) return 3 * 8;
      if (totalMonths < 24) return 7 * 8;
      if (totalMonths < 36) return 10 * 8;
      if (totalMonths < 48) return 14 * 8;
      if (totalMonths < 60) return 15 * 8;
      const years = Math.floor(totalMonths / 12);
      const days = Math.min(15 + (years - 5), 30);
      return days * 8;
    }

    function calculateOvertimeHoursFromClockOut(clockOutTimeStr) {
      if (!clockOutTimeStr) return 0;
      const [h, m] = clockOutTimeStr.split(':').map(Number);
      if (isNaN(h) || isNaN(m)) return 0;
      
      const totalMin = h * 60 + m;
      const baseMin = 18 * 60; // 18:00 開始算加班
      if (totalMin <= baseMin) return 0;

      const otMin = totalMin - baseMin;
      const units = Math.floor(otMin / 30);
      return units * 0.5;
    }

    function LeaveView({ userProfile, leaveRequests, setLeaveRequests, triggerToast }) {
      const myRequests = leaveRequests.filter(r => r.userId === userProfile.id);

      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [isFullDay, setIsFullDay] = useState(false);
      const [startTime, setStartTime] = useState('09:00');
      const [endTime, setEndTime] = useState('18:00');
      const [leaveType, setLeaveType] = useState('特休');
      const [cancelModalItem, setCancelModalItem] = useState(null);
      const [cancelReason, setCancelReason] = useState('');

      const dayOfWeek = useMemo(() => getDayOfWeekStr(date), [date]);

      const calculatedHours = useMemo(() => {
        if (isFullDay) return 8;
        const startH = parseInt(startTime.split(':')[0]);
        const endH = parseInt(endTime.split(':')[0]);
        let diff = endH - startH;
        if (startH <= 12 && endH >= 13) diff -= 1;
        return diff > 0 ? diff : 0;
      }, [isFullDay, startTime, endTime]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (calculatedHours <= 0) return alert('請假起訖時間不正確！');

        const newReq = {
          id: 'leave_' + Date.now(),
          userId: userProfile.id,
          userName: userProfile.name,
          date,
          dayOfWeek,
          startTime: isFullDay ? '09:00' : startTime,
          endTime: isFullDay ? '18:00' : endTime,
          isFullDay,
          leaveType,
          hours: calculatedHours,
          status: 'pending',
          rejectionReason: '',
          cancelReason: '',
          approverName: '',
          createdAt: new Date().toISOString()
        };

        setLeaveRequests([newReq, ...leaveRequests]);
        sendLineAdminNotification("新請假申請", `${userProfile.name} 申請 ${date} ${leaveType} (${calculatedHours}小時)`);
        triggerToast("請假申請已成功送出！");
      };

      const handleCancelSubmit = () => {
        if (!cancelReason) return alert('請填寫銷假原因！');
        setLeaveRequests(leaveRequests.map(r => r.id === cancelModalItem.id ? { ...r, status: 'cancel_pending', cancelReason } : r));
        setCancelModalItem(null);
        setCancelReason('');
        triggerToast("銷假申請已送出審核！");
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-file-pen text-blue-500"></i> 新增請假申請

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">

                  <label className="block text-xs font-bold text-slate-700 mb-1">申請人姓名</label>

                </div>

                  <div className="flex items-center gap-2">

                    <span className="text-xs font-bold text-blue-600 whitespace-nowrap">{dayOfWeek}</span>
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">假別</label>
                  <select value={leaveType} onChange={e => setLeaveType(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl">
                    <option value="特休">特休</option>
                    <option value="補休">補休</option>
                    <option value="事假">事假</option>
                    <option value="喪假">喪假</option>
                    <option value="婚假">婚假</option>
                    {userProfile.gender === 'female' && <option value="生理假">生理假</option>}

                  <input type="checkbox" checked={isFullDay} onChange={e => setIsFullDay(e.target.checked)} className="w-4 h-4 text-blue-600 rounded" />
                  <span className="text-xs font-bold text-slate-700">全日 (8小時)</span>
                </label>
              </div>

              {!isFullDay && (

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">開始時間</label>
                    <select value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl">
                      {['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'].map(t => <option key={t} value={t}>{t}</option>)}

              <div className="flex justify-between items-center pt-2">

                </div>

                  送出請假申請
                </button>
              </div>
            </form>
          </div>

          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">

                  <tr>

                    <th className="py-3 px-4">時段</th>

                    <th className="py-3 px-4">時數</th>
                    <th className="py-3 px-4">核准狀態與審核者</th>
                    <th className="py-3 px-4 text-right">操作</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {myRequests.length === 0 ? (
                    <tr><td colSpan="6" className="text-center py-6 text-slate-400 font-medium">尚無請假紀錄</td></tr>
                  ) : myRequests.map(req => (
                    <tr key={req.id} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-bold">{req.date} ({req.dayOfWeek})</td>
                      <td className="py-3 px-4">{req.isFullDay ? '全日' : `${req.startTime} ~ ${req.endTime}`}</td>
                      <td className="py-3 px-4"><span className="px-2 py-0.5 bg-slate-100 rounded text-xs font-semibold">{req.leaveType}</span></td>
                      <td className="py-3 px-4 font-bold">{req.hours} h</td>
                      <td className="py-3 px-4">
                        <StatusBadge status={req.status} approverName={req.approverName} />

                      </td>
                      <td className="py-3 px-4 text-right">

                          <button onClick={() => setCancelModalItem(req)} className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded-lg font-semibold">申請銷假</button>

                      </td>

                </div>
              </div>
            </div>
          )}
        </div>
      );

                  ) : myRequests.map(req => (
                    <tr key={req.id} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-bold">{req.date} ({req.dayOfWeek})</td>
                      <td className="py-3 px-4 text-xs font-medium text-slate-800">{req.reason}</td>
                      <td className="py-3 px-4">{req.planStart}~{req.planEnd} ({req.planHours}h)</td>
                      <td className="py-3 px-4"><StatusBadge status={req.preApprovalStatus} approverName={req.preApproverName} /></td>
                      <td className="py-3 px-4">
                        {req.actualClockOut ? `${req.actualClockOut} (${req.actualHours}h)` : '-'}
                      </td>
                      <td className="py-3 px-4">
                        {req.finalApprovalStatus === 'none' ? <span className="text-xs text-slate-400">待預審核准</span> : <StatusBadge status={req.finalApprovalStatus} approverName={req.finalApproverName} />}
                      </td>
                      <td className="py-3 px-4 text-right">
                        {req.preApprovalStatus === 'approved' && req.finalApprovalStatus !== 'approved' && (
                          <button onClick={() => { setActualModalItem(req); setActualClockOut('20:00'); }} className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg">
                            回報實際下班時間
                          </button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {actualModalItem && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
                <h4 className="font-bold text-slate-800 text-lg">第二階段：回報實際加班時間</h4>
                <p className="text-xs text-slate-600">日期：{actualModalItem.date} (預計 {actualModalItem.planHours} 小時)</p>
                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">實際下班時間</label>
                    <input type="time" required value={actualClockOut} onChange={e => setActualClockOut(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" />
                  </div>
                  <div className="p-3 bg-blue-50 rounded-xl border border-blue-100">
                    <span className="text-xs text-blue-700 font-bold block">依下班時間自動採計加班時數：</span>
                    <span className="text-xl font-black text-blue-800">{calculatedActualHours} <span className="text-xs font-normal">小時</span></span>
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setActualModalItem(null)} className="px-4 py-2 border border-slate-300 rounded-xl text-slate-600">取消</button>
                  <button onClick={handleActualSubmit} className="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700">送出複審</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function OutingView({ userProfile, outingRequests, setOutingRequests, triggerToast }) {
      const myRequests = outingRequests.filter(r => r.userId === userProfile.id);

      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [startTime, setStartTime] = useState('14:00');
      const [endTime, setEndTime] = useState('16:00');
      const [reason, setReason] = useState('');

      const dayOfWeek = useMemo(() => getDayOfWeekStr(date), [date]);

      const calculatedHours = useMemo(() => {
        const startH = parseInt(startTime.split(':')[0]);
        const endH = parseInt(endTime.split(':')[0]);
        let diff = endH - startH;
        return diff > 0 ? diff : 0;
      }, [startTime, endTime]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (calculatedHours <= 0) return alert('外出時間不正確！');
        if (!reason.trim()) return alert('請填寫外出事由！');

        const newReq = {
          id: 'out_' + Date.now(),
          userId: userProfile.id,
          userName: userProfile.name,
          date,
          dayOfWeek,
          startTime,
          endTime,
          hours: calculatedHours,
          reason,
          status: 'pending',
          rejectionReason: '',
          approverName: '',
          createdAt: new Date().toISOString()
        };

        setOutingRequests([newReq, ...outingRequests]);
        sendLineAdminNotification("新外出申請", `${userProfile.name} 申請 ${date} 外出 ${calculatedHours}小時`);
        triggerToast("外出申請已送出！");
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-person-walking-luggage text-blue-500"></i> 新增公幹/外出申請
            </h3>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">外出日期</label>
                  <div className="flex items-center gap-1">
                    <input type="date" required value={date} onChange={e => setDate(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" />
                    <span className="text-xs font-bold text-blue-600">{dayOfWeek}</span>
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">預計外出時間</label>
                  <select value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl">
                    {['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'].map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">預計返回時間</label>
                  <select value={endTime} onChange={e => setEndTime(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl">
                    {['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'].map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">外出事由 (必填)</label>
                <input type="text" required placeholder="請說明外出地點與公務事由..." value={reason} onChange={e => setReason(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" />
              </div>

              <div className="flex justify-between items-center pt-2">
                <div className="text-xs font-bold text-slate-600">
                  預計外出時數: <span className="text-base text-blue-600 font-black">{calculatedHours}</span> 小時
                </div>
                <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-xl transition shadow">
                  送出外出申請
                </button>
              </div>
            </form>
          </div>

          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-clock-rotate-left text-blue-500"></i> 我的外出申請紀錄
            </h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm text-slate-600">
                <thead className="bg-slate-50 text-slate-700 uppercase font-bold text-xs border-b border-slate-200">
                  <tr>
                    <th className="py-3 px-4">日期</th>
                    <th className="py-3 px-4">外出事由</th>
                    <th className="py-3 px-4">時段</th>
                    <th className="py-3 px-4">時數</th>
                    <th className="py-3 px-4">核准狀態與審核者</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {myRequests.length === 0 ? (
                    <tr><td colSpan="5" className="text-center py-6 text-slate-400 font-medium">尚無外出紀錄</td></tr>
                  ) : myRequests.map(req => (
                    <tr key={req.id} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-bold">{req.date} ({req.dayOfWeek})</td>
                      <td className="py-3 px-4 font-medium text-slate-800">{req.reason}</td>
                      <td className="py-3 px-4">{req.startTime} ~ {req.endTime}</td>
                      <td className="py-3 px-4 font-bold">{req.hours} h</td>
                      <td className="py-3 px-4">
                        <StatusBadge status={req.status} approverName={req.approverName} />
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function ApprovalView({ userProfile, leaveRequests, setLeaveRequests, overtimeRequests, setOvertimeRequests, outingRequests, setOutingRequests, usersList, setUsersList, triggerToast }) {
      const [rejectModal, setRejectModal] = useState(null);
      const [rejectionReason, setRejectionReason] = useState('');
      const [historyTab, setHistoryTab] = useState('leave');

      const canApproveLeave = userProfile.role === 'admin' || userProfile.delegatedScopes?.leave;
      const canApproveOvertime = userProfile.role === 'admin' || userProfile.delegatedScopes?.overtime;
      const canApproveOuting = userProfile.role === 'admin' || userProfile.delegatedScopes?.outing;

      const pendingLeaves = leaveRequests.filter(r => {
        if (r.userId === userProfile.id) return false;
        if (!canApproveLeave) return false;
        return r.status === 'pending' || r.status === 'cancel_pending';
      });

      const pendingOvertimes = overtimeRequests.filter(r => {
        if (r.userId === userProfile.id) return false;
        if (!canApproveOvertime) return false;
        return r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending';
      });

      const pendingOutings = outingRequests.filter(r => {
        if (r.userId === userProfile.id) return false;
        if (!canApproveOuting) return false;
        return r.status === 'pending';
      });

      const reviewedLeaves = leaveRequests.filter(r => {
        if (r.status === 'pending' || r.status === 'cancel_pending') return false;
        if (userProfile.role === 'admin') return true;
        return r.approverName === userProfile.name;
      });

      const reviewedOvertimes = overtimeRequests.filter(r => {
        if (r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending') return false;
        if (r.preApprovalStatus === 'none' && r.finalApprovalStatus === 'none') return false;
        if (userProfile.role === 'admin') return true;
        return r.preApproverName === userProfile.name || r.finalApproverName === userProfile.name;
      });

      const reviewedOutings = outingRequests.filter(r => {
        if (r.status === 'pending') return false;
        if (userProfile.role === 'admin') return true;
        return r.approverName === userProfile.name;
      });

      const handleApproveLeave = (req, isCancel = false) => {
        const newStatus = isCancel ? 'cancelled' : 'approved';
        setLeaveRequests(leaveRequests.map(r => r.id === req.id ? { 
          ...r, 
          status: newStatus, 
          approverName: userProfile.name 
        } : r));

        if (newStatus === 'approved' && req.leaveType === '補休') {
          setUsersList(usersList.map(u => u.id === req.userId ? { ...u, compLeaveHours: Math.max(0, (u.compLeaveHours || 0) - req.hours) } : u));
        }

        triggerToast(`已成功核准 ${req.userName} 的請假單！`);
      };

      const handleApproveOvertime = (req, stage) => {
        if (stage === 'pre') {
          setOvertimeRequests(overtimeRequests.map(r => r.id === req.id ? { 
            ...r, 
            preApprovalStatus: 'approved', 
            preApproverName: userProfile.name 
          } : r));
          triggerToast(`已通過 ${req.userName} 的第一階段加班預審！`);
        } else {
          const addHours = req.actualHours || req.planHours;
          setOvertimeRequests(overtimeRequests.map(r => r.id === req.id ? { 
            ...r, 
            finalApprovalStatus: 'approved', 
            finalApproverName: userProfile.name 
          } : r));

          setUsersList(usersList.map(u => u.id === req.userId ? { ...u, compLeaveHours: (u.compLeaveHours || 0) + addHours } : u));
          triggerToast(`已通過 ${req.userName} 的加班複審，自動累加 ${addHours} 小時至補休！`);
        }
      };

      const handleApproveOuting = (req) => {
        setOutingRequests(outingRequests.map(r => r.id === req.id ? { 
          ...r, 
          status: 'approved', 
          approverName: userProfile.name 
        } : r));
        triggerToast(`已核准 ${req.userName} 的外出申請！`);
      };

      const handleRejectSubmit = () => {
        if (!rejectionReason) return alert('請填寫駁回原因！');
        const { type, item } = rejectModal;

        if (type === 'leave') {
          setLeaveRequests(leaveRequests.map(r => r.id === item.id ? { ...r, status: 'rejected', rejectionReason, approverName: userProfile.name } : r));
        } else if (type === 'ot_pre') {
          setOvertimeRequests(overtimeRequests.map(r => r.id === item.id ? { ...r, preApprovalStatus: 'rejected', rejectionReason, preApproverName: userProfile.name } : r));
        } else if (type === 'ot_final') {
          setOvertimeRequests(overtimeRequests.map(r => r.id === item.id ? { ...r, finalApprovalStatus: 'rejected', rejectionReason, finalApproverName: userProfile.name } : r));
        } else if (type === 'outing') {
          setOutingRequests(outingRequests.map(r => r.id === item.id ? { ...r, status: 'rejected', rejectionReason, approverName: userProfile.name } : r));
        }

        setRejectModal(null);
        setRejectionReason('');
        triggerToast('已駁回該項申請！');
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-envelope-open-text text-amber-500"></i> 待審核請假/銷假申請
            </h3>
            <div className="space-y-3">
              {pendingLeaves.length === 0 ? (
                <p className="text-slate-400 text-sm text-center py-4 font-medium">目前無待處理請假申請</p>
              ) : pendingLeaves.map(req => (
                <div key={req.id} className="p-4 bg-slate-50 border border-slate-200 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-slate-800">{req.userName}</span>
                      <span className="text-xs bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-md">{req.leaveType}</span>
                      <span className="text-xs font-bold text-slate-600">{req.hours} 小時</span>
                      {req.status === 'cancel_pending' && <span className="text-xs bg-red-100 text-red-700 font-black px-2 py-0.5 rounded-md">申請銷假中</span>}
                    </div>
                    <p className="text-xs text-slate-500 mt-1">日期：{req.date} ({req.dayOfWeek}) {req.isFullDay ? '全日' : `${req.startTime}~${req.endTime}`}</p>
                    {req.cancelReason && <p className="text-xs text-red-600 mt-1 font-bold">銷假原因：{req.cancelReason}</p>}
                  </div>
                  <div className="flex items-center gap-2 self-end md:self-auto">
                    <button onClick={() => handleApproveLeave(req, req.status === 'cancel_pending')} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">
                      <i className="fa-solid fa-check mr-1"></i> 核准
                    </button>
                    <button onClick={() => setRejectModal({ type: 'leave', item: req })} className="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">
                      <i className="fa-solid fa-xmark mr-1"></i> 駁回
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-business-time text-indigo-500"></i> 待審核加班申請 (兩階段)
            </h3>
            <div className="space-y-3">
              {pendingOvertimes.length === 0 ? (
                <p className="text-slate-400 text-sm text-center py-4 font-medium">目前無待處理加班申請</p>
              ) : pendingOvertimes.map(req => {
                const isPre = req.preApprovalStatus === 'pending';
                return (
                  <div key={req.id} className="p-4 bg-slate-50 border border-slate-200 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-slate-800">{req.userName}</span>
                        <span className={`text-xs px-2 py-0.5 rounded-md font-bold ${isPre ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                          {isPre ? '第一階段 (預審)' : '第二階段 (複審)'}
                        </span>
                      </div>
                      <p className="text-xs text-slate-600 font-semibold mt-1">事由：{req.reason}</p>
                      <p className="text-xs text-slate-500 mt-0.5">
                        日期：{req.date} ({req.dayOfWeek}) | 預計：{req.planStart}~{req.planEnd} ({req.planHours}h)
                        {!isPre && <span className="text-slate-800 font-bold ml-2">實際下班：{req.actualClockOut} ({req.actualHours}h)</span>}
                      </p>
                    </div>
                    <div className="flex items-center gap-2 self-end md:self-auto">
                      <button onClick={() => handleApproveOvertime(req, isPre ? 'pre' : 'final')} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">
                        <i className="fa-solid fa-check mr-1"></i> 核准
                      </button>
                      <button onClick={() => setRejectModal({ type: isPre ? 'ot_pre' : 'ot_final', item: req })} className="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">
                        <i className="fa-solid fa-xmark mr-1"></i> 駁回
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-person-walking-luggage text-emerald-500"></i> 待審核外出申請
            </h3>
            <div className="space-y-3">
              {pendingOutings.length === 0 ? (
                <p className="text-slate-400 text-sm text-center py-4 font-medium">目前無待處理外出申請</p>
              ) : pendingOutings.map(req => (
                <div key={req.id} className="p-4 bg-slate-50 border border-slate-200 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-slate-800">{req.userName}</span>
                      <span className="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-md">外出 {req.hours} 小時</span>
                    </div>
                    <p className="text-xs text-slate-600 font-semibold mt-1">事由：{req.reason}</p>
                    <p className="text-xs text-slate-500 mt-0.5">日期：{req.date} ({req.dayOfWeek}) {req.startTime} ~ {req.endTime}</p>
                  </div>
                  <div className="flex items-center gap-2 self-end md:self-auto">
                    <button onClick={() => handleApproveOuting(req)} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">
                      <i className="fa-solid fa-check mr-1"></i> 核准
                    </button>
                    <button onClick={() => setRejectModal({ type: 'outing', item: req })} className="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">
                      <i className="fa-solid fa-xmark mr-1"></i> 駁回
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                <i className="fa-solid fa-clock-rotate-left text-blue-600"></i> 已審核考勤紀錄歷史
              </h3>
              <span className="text-xs font-bold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full">
                {userProfile.role === 'admin' ? '全系統審核總覽' : '我的審核歷程'}
              </span>
            </div>

            <div className="flex gap-2 border-b border-slate-200 mb-4">
              <button 
                onClick={() => setHistoryTab('leave')} 
                className={`pb-2 px-3 text-xs font-bold border-b-2 transition ${historyTab === 'leave' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'}`}
              >
                請假/銷假紀錄 ({reviewedLeaves.length})
              </button>
              <button 
                onClick={() => setHistoryTab('overtime')} 
                className={`pb-2 px-3 text-xs font-bold border-b-2 transition ${historyTab === 'overtime' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'}`}
              >
                加班紀錄 ({reviewedOvertimes.length})
              </button>
              <button 
                onClick={() => setHistoryTab('outing')} 
                className={`pb-2 px-3 text-xs font-bold border-b-2 transition ${historyTab === 'outing' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'}`}
              >
                外出紀錄 ({reviewedOutings.length})
              </button>
            </div>

            <div className="overflow-x-auto">
              {historyTab === 'leave' && (
                <table className="w-full text-left text-sm text-slate-600">
                  <thead className="bg-slate-50 text-slate-700 uppercase font-bold text-xs border-b border-slate-200">
                    <tr>
                      <th className="py-2.5 px-3">申請人</th>
                      <th className="py-2.5 px-3">日期</th>
                      <th className="py-2.5 px-3">假別</th>
                      <th className="py-2.5 px-3">時數</th>
                      <th className="py-2.5 px-3">結果與審核人</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {reviewedLeaves.length === 0 ? (
                      <tr><td colSpan="5" className="text-center py-4 text-xs text-slate-400">尚無相關審核歷史紀錄</td></tr>
                    ) : reviewedLeaves.map(r => (

    function AdminReportsView({ usersList, leaveRequests, overtimeRequests, outingRequests, clockLogs, setClockLogs }) {
      const [selectedMonth, setSelectedMonth] = useState('2026-10');
      const [uploading, setUploading] = useState(false);
      const [anomalies, setAnomalies] = useState([]);
      const [uploadedRawData, setUploadedRawData] = useState([]);

      const demoLogs = useMemo(() => [
        { clockId: 'C1003', userName: '王小明', date: '2026-10-02', time: '09:20', type: '簽到' },
        { clockId: 'C1003', userName: '王小明', date: '2026-10-02', time: '18:05', type: '簽退' },
        { clockId: 'C1002', userName: '陳經理', date: '2026-10-06', time: '09:05', type: '簽到' },
        { clockId: 'C1002', userName: '陳經理', date: '2026-10-06', time: '13:00', type: '簽到' },
        { clockId: 'C1002', userName: '陳經理', date: '2026-10-06', time: '20:15', type: '簽退' },
        { clockId: 'C1003', userName: '王小明', date: '2026-10-10', time: '10:00', type: '簽到' },
      ], []);

      const runAnomalyDetection = (rawLogs) => {
        const activeLogs = rawLogs && rawLogs.length > 0 ? rawLogs : demoLogs;
        const results = [];

        const targetUsers = usersList.filter(u => u.role !== 'admin');

        targetUsers.forEach(u => {
          const userPunches = activeLogs.filter(l => (l.clockId || l['打卡機代號'] || l['代號']) === u.clockId);
          
          const datesMap = {};
          userPunches.forEach(p => {
            const pDate = p.date || p['日期'];
            if (!pDate) return;
            if (!datesMap[pDate]) datesMap[pDate] = [];
            datesMap[pDate].push(p.time || p['時間'] || p['打卡時間']);
          });

          Object.keys(datesMap).forEach(dStr => {
            const dateObj = new Date(dStr);
            if (isNaN(dateObj.getTime())) return;

            const dayOfWeek = dateObj.getDay();
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

            const times = datesMap[dStr].sort();
            const morningIn = times[0];
            const lastOut = times[times.length - 1];

            const hasApprovedLeave = leaveRequests.some(r => r.userId === u.id && r.status === 'approved' && r.date === dStr);
            const hasApprovedOuting = outingRequests.some(r => r.userId === u.id && r.status === 'approved' && r.date === dStr);
            const hasApprovedOT = overtimeRequests.some(r => r.userId === u.id && r.finalApprovalStatus === 'approved' && r.date === dStr);

            if (!isWeekend) {
              if (times.length < 3 && !hasApprovedLeave && !hasApprovedOuting) {
                results.push({
                  clockId: u.clockId,
                  name: u.name,
                  date: dStr,
                  type: '打卡紀錄缺失/漏刷卡',
                  desc: `當日為工作日，打卡紀錄僅 ${times.length} 次 (${times.join(', ')})，少於標準「2上班1下班 (共3次)」要求且無核准之請假或外出紀錄`,
                  severity: 'high'
                });
              }

              if (morningIn && morningIn > "09:15" && !hasApprovedLeave) {
                results.push({
                  clockId: u.clockId,
                  name: u.name,
                  date: dStr,
                  type: '遲到異常',
                  desc: `早上班刷卡時間 (${morningIn}) 超過 09:15 彈性時間且無請假單`,
                  severity: 'high'
                });
              }

              if (lastOut && lastOut > "18:30" && !hasApprovedOT) {
                results.push({
                  clockId: u.clockId,
                  name: u.name,
                  date: dStr,
                  type: '未報備加班',
                  desc: `下班刷卡時間 (${lastOut}) 超過 18:30 且未經核准加班申請`,
                  severity: 'low'
                });
              }
            } else {
              if (times.length > 0 && !hasApprovedOT) {
                results.push({
                  clockId: u.clockId,
                  name: u.name,
                  date: dStr,
                  type: '假日打卡未報備',
                  desc: `週末非工作日出現刷卡紀錄 (${times.join(', ')})，但未有經核准之加班單據`,
                  severity: 'medium'
                });
              }
            }
          });
        });

        setAnomalies(results);
      };

      useEffect(() => {
        runAnomalyDetection(uploadedRawData);
      }, [usersList, leaveRequests, overtimeRequests, outingRequests, uploadedRawData]);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setUploading(true);
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            setUploadedRawData(jsonData);
            setClockLogs([...clockLogs.filter(c => c.month !== selectedMonth), { month: selectedMonth, logs: jsonData }]);
            runAnomalyDetection(jsonData);
            alert(`月份 ${selectedMonth} 的打卡機紀錄上傳成功！已即時解析出 ${jsonData.length} 筆打卡紀錄。`);
          } catch (err) {
            alert('檔案解析失敗: ' + err.message);
          } finally {
            setUploading(false);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const handleExportExcel = () => {
        const wb = XLSX.utils.book_new();

        const summaryData = usersList.map(u => {
          const uLeaves = leaveRequests.filter(r => r.userId === u.id && r.status === 'approved' && r.date.startsWith(selectedMonth));
          const uOT = overtimeRequests.filter(r => r.userId === u.id && r.finalApprovalStatus === 'approved' && r.date.startsWith(selectedMonth));
          const uOuting = outingRequests.filter(r => r.userId === u.id && r.status === 'approved' && r.date.startsWith(selectedMonth));
          
          const leaveHours = uLeaves.reduce((acc, r) => acc + r.hours, 0);
          const otHours = uOT.reduce((acc, r) => acc + (r.actualHours || r.planHours), 0);
          const outingHours = uOuting.reduce((acc, r) => acc + r.hours, 0);

          return {
            '打卡機代號': u.clockId,
            '姓名': u.name,
            '職稱': u.role === 'admin' ? '—' : u.title,
            '當月請假總時數': leaveHours,
            '當月加班總時數': otHours,
            '當月外出總時數': outingHours,
            '當前剩餘特休': u.role === 'admin' ? '不適用' : calculateAnnualLeaveHours(u.onboardDate),
            '可用補休 (結算上月)': u.compLeaveHours || 0
          };
        });
        const summaryWs = XLSX.utils.json_to_sheet(summaryData);
        XLSX.utils.book_append_sheet(wb, summaryWs, "全公司統計總表");

        const rawPunches = uploadedRawData.length > 0 ? uploadedRawData : demoLogs;
        const rawWs = XLSX.utils.json_to_sheet(rawPunches);
        XLSX.utils.book_append_sheet(wb, rawWs, "打卡機原始紀錄");

        usersList.forEach(u => {
          const uLeaves = leaveRequests.filter(r => r.userId === u.id && r.status === 'approved' && r.date.startsWith(selectedMonth));
          const uOT = overtimeRequests.filter(r => r.userId === u.id && r.finalApprovalStatus === 'approved' && r.date.startsWith(selectedMonth));
          const uOutings = outingRequests.filter(r => r.userId === u.id && r.status === 'approved' && r.date.startsWith(selectedMonth));

          const sheetRows = [];
          sheetRows.push({ A: `員工姓名: ${u.name}`, B: `職稱: ${u.role === 'admin' ? '—' : u.title}`, C: `打卡機代號: ${u.clockId}` });
          sheetRows.push({ A: `特休結算: ${u.role === 'admin' ? '不適用' : calculateAnnualLeaveHours(u.onboardDate)}`, B: `補休結算 (上月): ${u.role === 'admin' ? '不適用' : (u.compLeaveHours || 0)}` });
          sheetRows.push({});
          sheetRows.push({ A: '日期', B: '考勤項目', C: '時數/時段', D: '審核狀態', E: '事與備註' });

          uLeaves.forEach(l => sheetRows.push({ A: l.date, B: `請假: ${l.leaveType}`, C: l.hours, D: '已核准', E: l.isFullDay ? '全日' : `${l.startTime}~${l.endTime}` }));
          uOT.forEach(o => sheetRows.push({ A: o.date, B: '加班報銷', C: o.actualHours || o.planHours, D: '已核准', E: `事由: ${o.reason}` }));
          uOutings.forEach(g => sheetRows.push({ A: g.date, B: '公幹外出', C: g.hours, D: '已核准', E: `事由: ${g.reason}` }));

          const userWs = XLSX.utils.json_to_sheet(sheetRows, { skipHeader: true });
          const sheetName = `${u.clockId}_${u.name}`.substring(0, 31);
          XLSX.utils.book_append_sheet(wb, userWs, sheetName);
        });

        XLSX.writeFile(wb, `TASO_公司月度考勤結算表_${selectedMonth}.xlsx`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-file-excel text-emerald-600"></i> 考勤報表對照與匯出中心
            </h3>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
                <h4 className="font-bold text-slate-700 text-sm">1. 上傳當月打卡機文字紀錄 (.xlsx / .csv)</h4>
                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1">選擇考勤月份</label>
                  <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="px-3 py-1.5 border border-slate-300 rounded-xl text-sm w-full font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1">上傳打卡紀錄檔</label>
                  <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} disabled={uploading} className="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                </div>
              </div>

              <div className="p-4 bg-blue-50 border border-blue-100 rounded-xl flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-blue-900 text-sm">2. 產生當月完整 Excel 報表 (包含打卡機原始頁籤)</h4>
                  <p className="text-xs text-blue-700 mt-1 leading-relaxed">
                    匯出全公司統計總表、上傳的「打卡機原始紀錄」頁籤以及每位同仁的獨立明細工作表 `.xlsx`。
                  </p>
                </div>
                <button onClick={handleExportExcel} className="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl transition shadow flex items-center justify-center gap-2">
                  <i className="fa-solid fa-download"></i> 一鍵匯出當月完整報表
                </button>
              </div>
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                <i className="fa-solid fa-triangle-exclamation text-amber-500"></i> 出勤異常比對紀錄 (自動排除系統管理員)
              </h3>
              <span className="text-xs font-bold bg-amber-100 text-amber-800 px-3 py-1 rounded-full">
                共發現 {anomalies.length} 筆待稽核紀錄
              </span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm text-slate-600">
                <thead className="bg-slate-50 text-slate-700 uppercase font-bold text-xs border-b border-slate-200">
                  <tr>
                    <th className="py-3 px-4">代號</th>
                    <th className="py-3 px-4">姓名</th>
                    <th className="py-3 px-4">異常日期</th>
                    <th className="py-3 px-4">異常類別</th>
                    <th className="py-3 px-4">詳細說明</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {anomalies.length === 0 ? (
                    <tr><td colSpan="5" className="text-center py-6 text-slate-400 font-medium">太棒了！未發現任何出勤異常紀錄。</td></tr>
                  ) : anomalies.map((item, idx) => (
                    <tr key={idx} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-mono font-bold text-slate-800">{item.clockId}</td>
                      <td className="py-3 px-4 font-bold text-slate-800">{item.name}</td>
                      <td className="py-3 px-4 font-semibold">{item.date}</td>
                      <td className="py-3 px-4">
                        <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${
                          item.severity === 'high' ? 'bg-red-100 text-red-800' :
                          item.severity === 'medium' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700'
                        }`}>
                          {item.type}
                        </span>
                      </td>
                      <td className="py-3 px-4 text-xs font-medium text-slate-600">{item.desc}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function StatusBadge({ status, approverName }) {
      const config = {
        pending: { label: '待審核', class: 'bg-amber-100 text-amber-800' },
        approved: { label: '已核准', class: 'bg-emerald-100 text-emerald-800' },
        rejected: { label: '已被駁回', class: 'bg-red-100 text-red-800' },
        cancel_preview: { label: '銷假待審', class: 'bg-purple-100 text-purple-800' },
        cancel_pending: { label: '銷假待審', class: 'bg-purple-100 text-purple-800' },
        cancelled: { label: '已銷假', class: 'bg-slate-200 text-slate-700' }
      };
      const conf = config[status] || { label: status, class: 'bg-slate-100 text-slate-800' };

      return (
        <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full inline-flex items-center gap-1 ${conf.class}`}>
          <span>{conf.label}</span>
          {status === 'approved' && approverName && (
            <span className="text-[10px] opacity-80 font-normal">({approverName})</span>
          )}
        </span>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
