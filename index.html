    function getDayOfWeekStr(dateStr) {
      if (!dateStr) return '';
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? '' : `星期${days[d.getDay()]}`;
    }

    function calculateSeniority(onboardDateStr) {
      if (!onboardDateStr) return { str: '未提供', totalMonths: 0 };
      const start = new Date(onboardDateStr);
      const now = new Date();
      if (isNaN(start.getTime())) return { str: '無效日期', totalMonths: 0 };

      let years = now.getFullYear() - start.getFullYear();
      let months = now.getMonth() - start.getMonth();
      let days = now.getDate() - start.getDate();

      if (days < 0) {
        months -= 1;
        const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        days += prevMonthLastDay;
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      const totalMonths = Math.max(0, years * 12 + months);
      return {
        str: `${years > 0 ? years + ' 年 ' : ''}${Math.max(0, months)} 個月 ${Math.max(0, days)} 天`,
        years,
        months,
        totalMonths
      };
    }

    function calculateAnnualLeaveHours(onboardDateStr) {
      const { totalMonths } = calculateSeniority(onboardDateStr);
      if (totalMonths < 6) return 0;
      if (totalMonths < 12) return 3 * 8;
      if (totalMonths < 24) return 7 * 8;
      if (totalMonths < 36) return 10 * 8;
      if (totalMonths < 48) return 14 * 8;
      if (totalMonths < 60) return 15 * 8;
      const years = Math.floor(totalMonths / 12);
      const days = Math.min(15 + (years - 5), 30);
      return days * 8;
    }

    function calculateOvertimeHoursFromClockOut(clockOutTimeStr) {
      if (!clockOutTimeStr) return 0;
      const [h, m] = clockOutTimeStr.split(':').map(Number);
      if (isNaN(h) || isNaN(m)) return 0;
      
      const totalMin = h * 60 + m;
      const baseMin = 18 * 60;
      if (totalMin <= baseMin) return 0;

      const otMin = totalMin - baseMin;
      const units = Math.floor(otMin / 30);
      return units * 0.5;
    }

      const monthlyStats = useMemo(() => {
        if (!userProfile) return { leaveHours: 0, otHours: 0, annualRemaining: 0, annualTotal: 0 };
        const currentMonthPrefix = new Date().toISOString().substring(0, 7);

        const monthLeaves = leaveRequests.filter(r => r.userId === userProfile.id && r.status === 'approved' && r.date.startsWith(currentMonthPrefix));

        const monthOts = overtimeRequests.filter(r => r.userId === userProfile.id && r.finalApprovalStatus === 'approved' && r.date.startsWith(currentMonthPrefix));

        const annualTotal = calculateAnnualLeaveHours(userProfile.onboardDate);
        const usedAnnual = leaveRequests.filter(r => r.userId === userProfile.id && r.status === 'approved' && r.leaveType === '特休').reduce((sum, r) => sum + Number(r.hours || 0), 0);

        return { leaveHours, otHours, annualRemaining, annualTotal };
      }, [userProfile, leaveRequests, overtimeRequests]);

      const myPendingLeaveCount = useMemo(() => {
        if (!userProfile) return 0;
        return leaveRequests.filter(r => r.userId === userProfile.id && (r.status === 'pending' || r.status === 'cancel_pending')).length;
      }, [leaveRequests, userProfile]);

      const myPendingOvertimeCount = useMemo(() => {
        if (!userProfile) return 0;
        return overtimeRequests.filter(r => r.userId === userProfile.id && (r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending')).length;
      }, [overtimeRequests, userProfile]);

      const myPendingOutingCount = useMemo(() => {
        if (!userProfile) return 0;
        return outingRequests.filter(r => r.userId === userProfile.id && r.status === 'pending').length;
      }, [outingRequests, userProfile]);

      const adminPendingLeaveCount = useMemo(() => {
        if (!userProfile) return 0;
        return leaveRequests.filter(r => {
          if (r.userId === userProfile.id) return false;
          if (userProfile.role === 'delegated_admin' && !userProfile.delegatedScopes?.leave) return false;
          return r.status === 'pending' || r.status === 'cancel_pending';
        }).length;
      }, [leaveRequests, userProfile]);

      const adminPendingOvertimeCount = useMemo(() => {
        if (!userProfile) return 0;
        return overtimeRequests.filter(r => {
          if (r.userId === userProfile.id) return false;
          if (userProfile.role === 'delegated_admin' && !userProfile.delegatedScopes?.overtime) return false;
          return r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending';

      }, [overtimeRequests, userProfile]);

      const adminPendingOutingCount = useMemo(() => {
        if (!userProfile) return 0;
        return outingRequests.filter(r => {
          if (r.userId === userProfile.id) return false;
          if (userProfile.role === 'delegated_admin' && !userProfile.delegatedScopes?.outing) return false;
          return r.status === 'pending';
        }).length;
      }, [outingRequests, userProfile]);

      const totalAdminPendingCount = adminPendingLeaveCount + adminPendingOvertimeCount + adminPendingOutingCount;

      const handleLoginSubmit = (e) => {

                      <div className="text-[11px] text-slate-400 font-medium">可用補休時數</div>

          <nav className="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">

              {userProfile.role !== 'admin' && (
                <>
                  <TabButton id="leave" icon="fa-calendar-minus" label="請假申請" badgeCount={myPendingLeaveCount} activeTab={activeTab} setActiveTab={setActiveTab} />
                  <TabButton id="overtime" icon="fa-business-time" label="加班申請" badgeCount={myPendingOvertimeCount} activeTab={activeTab} setActiveTab={setActiveTab} />
                  <TabButton id="outing" icon="fa-person-walking-luggage" label="外出申請" badgeCount={myPendingOutingCount} activeTab={activeTab} setActiveTab={setActiveTab} />
                </>
              )}
              {(userProfile.role === 'admin' || userProfile.role === 'delegated_admin') && (
                <TabButton id="approval" icon="fa-clipboard-check" label="考勤審核" badgeCount={totalAdminPendingCount} activeTab={activeTab} setActiveTab={setActiveTab} />
              )}
              {userProfile.role === 'admin' && (
                <TabButton id="employee_management" icon="fa-user-plus" label="員工與假期管理" activeTab={activeTab} setActiveTab={setActiveTab} />
              )}
              {(userProfile.role === 'admin' || userProfile.role === 'delegated_admin') && (
                <TabButton id="admin_reports" icon="fa-sliders" label="考勤報表與異常比對" activeTab={activeTab} setActiveTab={setActiveTab} />
              )}
            </div>
          </nav>

          <main className="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
            {activeTab === 'profile' && <ProfileView userProfile={userProfile} monthlyStats={monthlyStats} pendingStats={{ pendingLeaveCount: adminPendingLeaveCount, pendingOvertimeCount: adminPendingOvertimeCount, pendingOutingCount: adminPendingOutingCount }} />}
            {activeTab === 'leave' && userProfile.role !== 'admin' && <LeaveView userProfile={userProfile} leaveRequests={leaveRequests} setLeaveRequests={setLeaveRequests} triggerToast={triggerToast} />}
            {activeTab === 'overtime' && userProfile.role !== 'admin' && <OvertimeView userProfile={userProfile} overtimeRequests={overtimeRequests} setOvertimeRequests={setOvertimeRequests} triggerToast={triggerToast} />}
            {activeTab === 'outing' && userProfile.role !== 'admin' && <OutingView userProfile={userProfile} outingRequests={outingRequests} setOutingRequests={setOutingRequests} triggerToast={triggerToast} />}
            {activeTab === 'approval' && (userProfile.role === 'admin' || userProfile.role === 'delegated_admin') && <ApprovalView userProfile={userProfile} leaveRequests={leaveRequests} setLeaveRequests={setLeaveRequests} overtimeRequests={overtimeRequests} setOvertimeRequests={setOvertimeRequests} outingRequests={outingRequests} setOutingRequests={setOutingRequests} usersList={usersList} setUsersList={setUsersList} triggerToast={triggerToast} />}
            {activeTab === 'employee_management' && userProfile.role === 'admin' && <EmployeeManagementView usersList={usersList} setUsersList={setUsersList} holidaysList={holidaysList} setHolidaysList={setHolidaysList} triggerToast={triggerToast} />}
            {activeTab === 'admin_reports' && (userProfile.role === 'admin' || userProfile.role === 'delegated_admin') && <AdminReportsView userProfile={userProfile} usersList={usersList} leaveRequests={leaveRequests} overtimeRequests={overtimeRequests} outingRequests={outingRequests} holidaysList={holidaysList} clockLogs={clockLogs} setClockLogs={setClockLogs} />}
          </main>

          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 text-xs font-bold animate-pulse">
              <i className="fa-solid fa-circle-check text-emerald-400 text-base"></i>
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    function TabButton({ id, icon, label, badgeCount = 0, activeTab, setActiveTab }) {
      const active = activeTab === id;
      return (
        <button onClick={() => setActiveTab(id)} className={`flex items-center gap-2 py-3.5 px-1 border-b-2 font-bold text-sm whitespace-nowrap transition-colors relative ${active ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}`}>
          <i className={`fa-solid ${icon}`}></i> {label}
          {badgeCount > 0 && <span className="ml-1 px-2 py-0.5 text-xs font-black bg-red-500 text-white rounded-full">{badgeCount}</span>}
        </button>
      );
    }

    function ProfileView({ userProfile, monthlyStats, pendingStats }) {
      const seniority = useMemo(() => calculateSeniority(userProfile.onboardDate), [userProfile.onboardDate]);
      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="lg:col-span-1 space-y-4">
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
              {userProfile.role === 'admin' ? (
                <>

    function LeaveView({ userProfile, leaveRequests, setLeaveRequests, triggerToast }) {
      const myRequests = leaveRequests.filter(r => r.userId === userProfile.id);
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [isFullDay, setIsFullDay] = useState(false);
      const [startTime, setStartTime] = useState('09:00');
      const [endTime, setEndTime] = useState('18:00');
      const [leaveType, setLeaveType] = useState('特休');
      const [cancelModalItem, setCancelModalItem] = useState(null);
      const [cancelReason, setCancelReason] = useState('');

      const dayOfWeek = useMemo(() => getDayOfWeekStr(date), [date]);
      const calculatedHours = useMemo(() => {
        if (isFullDay) return 8;
        const startH = parseInt(startTime.split(':')[0]);
        const endH = parseInt(endTime.split(':')[0]);
        let diff = endH - startH;
        if (startH <= 12 && endH >= 13) diff -= 1;
        return diff > 0 ? diff : 0;
      }, [isFullDay, startTime, endTime]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (calculatedHours <= 0) return alert('請假起訖時間不正確！');
        const newReq = {
          id: 'leave_' + Date.now(),
          userId: userProfile.id,
          userName: userProfile.name,
          date,
          dayOfWeek,
          startTime: isFullDay ? '09:00' : startTime,
          endTime: isFullDay ? '18:00' : endTime,
          isFullDay,
          leaveType,
          hours: calculatedHours,
          status: 'pending',
          rejectionReason: '',
          cancelReason: '',
          approverName: '',
          createdAt: new Date().toISOString()
        };
        setLeaveRequests([newReq, ...leaveRequests]);
        triggerToast("請假申請已成功送出！");
      };

      const handleCancelSubmit = () => {
        if (!cancelReason) return alert('請填寫銷假原因！');
        setLeaveRequests(leaveRequests.map(r => r.id === cancelModalItem.id ? { ...r, status: 'cancel_pending', cancelReason } : r));
        setCancelModalItem(null);
        setCancelReason('');
        triggerToast("銷假申請已送出審核！");
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-file-pen text-blue-500"></i> 新增請假申請</h3>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label className="block text-xs font-bold text-slate-700 mb-1">申請人姓名</label><input type="text" disabled value={userProfile.name} className="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-xl text-slate-700 font-bold" /></div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">請假日期</label>
                  <div className="flex items-center gap-2"><input type="date" required value={date} onChange={e => setDate(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" /><span className="text-xs font-bold text-blue-600 whitespace-nowrap">{dayOfWeek}</span></div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">假別</label>
                  <select value={leaveType} onChange={e => setLeaveType(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl">
                    <option value="特休">特休</option><option value="補休">補休</option><option value="事假">事假</option><option value="喪假">喪假</option><option value="婚假">婚假</option>
                    {userProfile.gender === 'female' && <option value="生理假">生理假</option>}
                  </select>
                </div>
              </div>
              <div className="flex items-center gap-4 pt-1"><label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={isFullDay} onChange={e => setIsFullDay(e.target.checked)} className="w-4 h-4 text-blue-600 rounded" /><span className="text-xs font-bold text-slate-700">全日 (8小時)</span></label></div>
              {!isFullDay && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div><label className="block text-xs font-bold text-slate-700 mb-1">開始時間</label><select value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl">{['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'].map(t => <option key={t} value={t}>{t}</option>}</select></div>
                  <div><label className="block text-xs font-bold text-slate-700 mb-1">結束時間</label><select value={endTime} onChange={e => setEndTime(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl">{['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'].map(t => <option key={t} value={t}>{t}</option>}</select></div>
                </div>
              )}
              <div className="flex justify-between items-center pt-2">
                <div className="text-xs font-bold text-slate-600">請假時數: <span className="text-base text-blue-600 font-black">{calculatedHours}</span> 小時</div>
                <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-xl transition shadow">送出請假申請</button>
              </div>
            </form>
          </div>
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-clock-rotate-left text-blue-500"></i> 我的請假紀錄</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm text-slate-600">
                <thead className="bg-slate-50 text-slate-700 uppercase font-bold text-xs border-b border-slate-200"><tr><th className="py-3 px-4">日期</th><th className="py-3 px-4">時段</th><th className="py-3 px-4">假別</th><th className="py-3 px-4">時數</th><th className="py-3 px-4">核准狀態</th><th className="py-3 px-4 text-right">操作</th></tr></thead>
                <tbody className="divide-y divide-slate-100">
                  {myRequests.length === 0 ? <tr><td colSpan="6" className="text-center py-6 text-slate-400 font-medium">尚無請假紀錄</td></tr> : myRequests.map(req => (
                    <tr key={req.id} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-bold">{req.date} ({req.dayOfWeek})</td>
                      <td className="py-3 px-4">{req.isFullDay ? '全日' : `${req.startTime} ~ ${req.endTime}`}</td>
                      <td className="py-3 px-4"><span className="px-2 py-0.5 bg-slate-100 rounded text-xs font-semibold">{req.leaveType}</span></td>
                      <td className="py-3 px-4 font-bold">{req.hours} h</td>
                      <td className="py-3 px-4"><StatusBadge status={req.status} approverName={req.approverName} /></td>
                      <td className="py-3 px-4 text-right">{req.status === 'approved' && <button onClick={() => setCancelModalItem(req)} className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded-lg font-semibold">申請銷假</button>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          {cancelModalItem && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
                <h4 className="font-bold text-slate-800 text-lg">申請銷假</h4>
                <p className="text-xs text-slate-600">日期：{cancelModalItem.date} ({cancelModalItem.hours}小時 {cancelModalItem.leaveType})</p>
                <div><label className="block text-xs font-bold text-slate-700 mb-1">銷假原因</label><textarea rows="3" value={cancelReason} onChange={e => setCancelReason(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" placeholder="請說明銷假原因..."></textarea></div>
                <div className="flex justify-end gap-2"><button onClick={() => setCancelModalItem(null)} className="px-4 py-2 border rounded-xl text-slate-600">取消</button><button onClick={handleCancelSubmit} className="px-4 py-2 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700">送出銷假</button></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function OvertimeView({ userProfile, overtimeRequests, setOvertimeRequests, triggerToast }) {
      const myRequests = overtimeRequests.filter(r => r.userId === userProfile.id);
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [planStart, setPlanStart] = useState('18:00');
      const [planEnd, setPlanEnd] = useState('20:00');
      const [planHours, setPlanHours] = useState(2);
      const [reason, setReason] = useState('');
      const [actualModalItem, setActualModalItem] = useState(null);
      const [actualClockOut, setActualClockOut] = useState('20:00');

      const dayOfWeek = useMemo(() => getDayOfWeekStr(date), [date]);
      const calculatedActualHours = useMemo(() => calculateOvertimeHoursFromClockOut(actualClockOut), [actualClockOut]);

      const handlePlanSubmit = (e) => {
        e.preventDefault();
        if (!reason.trim()) return alert('請填寫加班事由！');
        const newOt = {
          id: 'ot_' + Date.now(),
          userId: userProfile.id,
          userName: userProfile.name,
          date,
          dayOfWeek,
          planStart,
          planEnd,
          planHours: Number(planHours),
          reason,
          preApprovalStatus: 'pending',
          preApproverName: '',
          actualClockOut: '',
          actualHours: 0,
          finalApprovalStatus: 'none',
          finalApproverName: '',
          rejectionReason: '',
          createdAt: new Date().toISOString()
        };
        setOvertimeRequests([newOt, ...overtimeRequests]);
        triggerToast("加班預先申請已送出！");
      };

      const handleActualSubmit = () => {
        if (calculatedActualHours <= 0) return alert('實際下班時間未超過 18:00，無法採計加班！');
        setOvertimeRequests(overtimeRequests.map(r => r.id === actualModalItem.id ? { ...r, actualClockOut, actualHours: calculatedActualHours, finalApprovalStatus: 'pending' } : r));
        setActualModalItem(null);
        triggerToast("實際加班時數已回報，送出複審！");
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-briefcase text-blue-500"></i> 第一階段：預先申請加班</h3>
            <form onSubmit={handlePlanSubmit} className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div><label className="block text-xs font-bold text-slate-700 mb-1">申請日期</label><div className="flex items-center gap-1"><input type="date" required value={date} onChange={e => setDate(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" /><span className="text-xs font-bold text-blue-600">{dayOfWeek}</span></div></div>
                <div><label className="block text-xs font-bold text-slate-700 mb-1">預計起時</label><input type="time" required value={planStart} onChange={e => setPlanStart(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" /></div>
                <div><label className="block text-xs font-bold text-slate-700 mb-1">預計迄時</label><input type="time" required value={planEnd} onChange={e => setPlanEnd(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" /></div>
                <div><label className="block text-xs font-bold text-slate-700 mb-1">預計時數</label><input type="number" step="0.5" min="0.5" required value={planHours} onChange={e => setPlanHours(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" /></div>
              </div>
              <div><label className="block text-xs font-bold text-slate-700 mb-1">加班事由 (必填)</label><input type="text" required placeholder="請說明加班事由..." value={reason} onChange={e => setReason(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" /></div>
              <div className="flex justify-end pt-2"><button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-xl transition shadow">送出預審申請</button></div>
            </form>
          </div>
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-list-check text-blue-500"></i> 我的加班紀錄與報銷進度</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm text-slate-600">
                <thead className="bg-slate-50 text-slate-700 uppercase font-bold text-xs border-b border-slate-200"><tr><th className="py-3 px-4">日期</th><th className="py-3 px-4">加班事由</th><th className="py-3 px-4">預計時段/時數</th><th className="py-3 px-4">預審</th><th className="py-3 px-4">實際下班/採計</th><th className="py-3 px-4">複審</th><th className="py-3 px-4 text-right">操作</th></tr></thead>
                <tbody className="divide-y divide-slate-100">
                  {myRequests.length === 0 ? <tr><td colSpan="7" className="text-center py-6 text-slate-400 font-medium">尚無加班紀錄</td></tr> : myRequests.map(req => (
                    <tr key={req.id} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-bold">{req.date} ({req.dayOfWeek})</td>
                      <td className="py-3 px-4 text-xs font-medium text-slate-800">{req.reason}</td>
                      <td className="py-3 px-4">{req.planStart}~{req.planEnd} ({req.planHours}h)</td>
                      <td className="py-3 px-4"><StatusBadge status={req.preApprovalStatus} approverName={req.preApproverName} /></td>
                      <td className="py-3 px-4">{req.actualClockOut ? `${req.actualClockOut} (${req.actualHours}h)` : '-'}</td>
                      <td className="py-3 px-4">{req.finalApprovalStatus === 'none' ? <span className="text-xs text-slate-400">待預審核准</span> : <StatusBadge status={req.finalApprovalStatus} approverName={req.finalApproverName} />}</td>
                      <td className="py-3 px-4 text-right">{req.preApprovalStatus === 'approved' && req.finalApprovalStatus !== 'approved' && <button onClick={() => { setActualModalItem(req); setActualClockOut('20:00'); }} className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg">回報實際下班</button>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          {actualModalItem && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
                <h4 className="font-bold text-slate-800 text-lg">第二階段：回報實際加班時間</h4>
                <p className="text-xs text-slate-600">日期：{actualModalItem.date}</p>
                <div><label className="block text-xs font-bold text-slate-700 mb-1">實際下班時間</label><input type="time" required value={actualClockOut} onChange={e => setActualClockOut(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" /></div>
                <div className="p-3 bg-blue-50 rounded-xl border border-blue-100"><span className="text-xs text-blue-700 font-bold block">自動採計加班時數：</span><span className="text-xl font-black text-blue-800">{calculatedActualHours} 小時</span></div>
                <div className="flex justify-end gap-2 pt-2"><button onClick={() => setActualModalItem(null)} className="px-4 py-2 border rounded-xl text-slate-600">取消</button><button onClick={handleActualSubmit} className="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700">送出複審</button></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function OutingView({ userProfile, outingRequests, setOutingRequests, triggerToast }) {
      const myRequests = outingRequests.filter(r => r.userId === userProfile.id);
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [startTime, setStartTime] = useState('14:00');
      const [endTime, setEndTime] = useState('16:00');
      const [reason, setReason] = useState('');

      const dayOfWeek = useMemo(() => getDayOfWeekStr(date), [date]);
      const calculatedHours = useMemo(() => {
        const startH = parseInt(startTime.split(':')[0]);
        const endH = parseInt(endTime.split(':')[0]);
        return Math.max(0, endH - startH);
      }, [startTime, endTime]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (calculatedHours <= 0) return alert('外出時間不正確！');
        if (!reason.trim()) return alert('請填寫外出事由！');
        const newReq = {
          id: 'out_' + Date.now(),
          userId: userProfile.id,
          userName: userProfile.name,
          date,
          dayOfWeek,
          startTime,
          endTime,
          hours: calculatedHours,
          reason,
          status: 'pending',
          rejectionReason: '',
          approverName: '',
          createdAt: new Date().toISOString()
        };
        setOutingRequests([newReq, ...outingRequests]);
        triggerToast("外出申請已送出！");
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-person-walking-luggage text-blue-500"></i> 新增外出申請</h3>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label className="block text-xs font-bold text-slate-700 mb-1">外出日期</label><div className="flex items-center gap-1"><input type="date" required value={date} onChange={e => setDate(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" /><span className="text-xs font-bold text-blue-600">{dayOfWeek}</span></div></div>
                <div><label className="block text-xs font-bold text-slate-700 mb-1">開始時間</label><select value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl">{['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'].map(t => <option key={t} value={t}>{t}</option>}</select></div>
                <div><label className="block text-xs font-bold text-slate-700 mb-1">返回時間</label><select value={endTime} onChange={e => setEndTime(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl">{['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'].map(t => <option key={t} value={t}>{t}</option>}</select></div>
              </div>
              <div><label className="block text-xs font-bold text-slate-700 mb-1">外出事由 (必填)</label><input type="text" required placeholder="請說明外出地點與事由..." value={reason} onChange={e => setReason(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl" /></div>
              <div className="flex justify-between items-center pt-2">
                <div className="text-xs font-bold text-slate-600">時數: <span className="text-base text-blue-600 font-black">{calculatedHours}</span> 小時</div>
                <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-xl transition shadow">送出外出申請</button>
              </div>
            </form>
          </div>
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-clock-rotate-left text-blue-500"></i> 我的外出紀錄</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm text-slate-600">
                <thead className="bg-slate-50 text-slate-700 uppercase font-bold text-xs border-b border-slate-200"><tr><th className="py-3 px-4">日期</th><th className="py-3 px-4">事由</th><th className="py-3 px-4">時段</th><th className="py-3 px-4">時數</th><th className="py-3 px-4">狀態</th></tr></thead>
                <tbody className="divide-y divide-slate-100">
                  {myRequests.length === 0 ? <tr><td colSpan="5" className="text-center py-6 text-slate-400 font-medium">尚無外出紀錄</td></tr> : myRequests.map(req => (
                    <tr key={req.id} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-bold">{req.date} ({req.dayOfWeek})</td>
                      <td className="py-3 px-4 font-medium text-slate-800">{req.reason}</td>
                      <td className="py-3 px-4">{req.startTime} ~ {req.endTime}</td>
                      <td className="py-3 px-4 font-bold">{req.hours} h</td>
                      <td className="py-3 px-4"><StatusBadge status={req.status} approverName={req.approverName} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function ApprovalView({ userProfile, leaveRequests, setLeaveRequests, overtimeRequests, setOvertimeRequests, outingRequests, setOutingRequests, usersList, setUsersList, triggerToast }) {
      const [rejectModal, setRejectModal] = useState(null);
      const [rejectionReason, setRejectionReason] = useState('');
      const [historyTab, setHistoryTab] = useState('leave');

      const canApproveLeave = userProfile.role === 'admin' || userProfile.delegatedScopes?.leave;
      const canApproveOvertime = userProfile.role === 'admin' || userProfile.delegatedScopes?.overtime;
      const canApproveOuting = userProfile.role === 'admin' || userProfile.delegatedScopes?.outing;

      const pendingLeaves = leaveRequests.filter(r => r.userId !== userProfile.id && canApproveLeave && (r.status === 'pending' || r.status === 'cancel_pending'));
      const pendingOvertimes = overtimeRequests.filter(r => r.userId !== userProfile.id && canApproveOvertime && (r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending'));
      const pendingOutings = outingRequests.filter(r => r.userId !== userProfile.id && canApproveOuting && r.status === 'pending');

      const reviewedLeaves = leaveRequests.filter(r => r.status !== 'pending' && r.status !== 'cancel_pending' && (userProfile.role === 'admin' || r.approverName === userProfile.name));
      const reviewedOvertimes = overtimeRequests.filter(r => !(r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending') && !(r.preApprovalStatus === 'none' && r.finalApprovalStatus === 'none') && (userProfile.role === 'admin' || r.preApproverName === userProfile.name || r.finalApproverName === userProfile.name));
      const reviewedOutings = outingRequests.filter(r => r.status !== 'pending' && (userProfile.role === 'admin' || r.approverName === userProfile.name));

      const handleApproveLeave = (req, isCancel = false) => {
        const newStatus = isCancel ? 'cancelled' : 'approved';
        setLeaveRequests(leaveRequests.map(r => r.id === req.id ? { ...r, status: newStatus, approverName: userProfile.name } : r));
        if (newStatus === 'approved' && req.leaveType === '補休') {
          setUsersList(usersList.map(u => u.id === req.userId ? { ...u, compLeaveHours: Math.max(0, (u.compLeaveHours || 0) - req.hours) } : u));
        }
        triggerToast(`已核准 ${req.userName} 的請假單！`);
      };

      const handleApproveOvertime = (req, stage) => {
        if (stage === 'pre') {
          setOvertimeRequests(overtimeRequests.map(r => r.id === req.id ? { ...r, preApprovalStatus: 'approved', preApproverName: userProfile.name } : r));
          triggerToast(`已通過 ${req.userName} 的加班預審！`);
        } else {
          const addHours = req.actualHours || req.planHours;
          setOvertimeRequests(overtimeRequests.map(r => r.id === req.id ? { ...r, finalApprovalStatus: 'approved', finalApproverName: userProfile.name } : r));
          setUsersList(usersList.map(u => u.id === req.userId ? { ...u, compLeaveHours: (u.compLeaveHours || 0) + addHours } : u));
          triggerToast(`已通過 ${req.userName} 加班複審，累加 ${addHours} 小時補休！`);
        }
      };

      const handleApproveOuting = (req) => {
        setOutingRequests(outingRequests.map(r => r.id === req.id ? { ...r, status: 'approved', approverName: userProfile.name } : r));
        triggerToast(`已核准 ${req.userName} 的外出申請！`);
      };

      const handleRejectSubmit = () => {
        if (!rejectionReason) return alert('請填寫駁回原因！');
        const { type, item } = rejectModal;
        if (type === 'leave') setLeaveRequests(leaveRequests.map(r => r.id === item.id ? { ...r, status: 'rejected', rejectionReason, approverName: userProfile.name } : r));
        else if (type === 'ot_pre') setOvertimeRequests(overtimeRequests.map(r => r.id === item.id ? { ...r, preApprovalStatus: 'rejected', rejectionReason, preApproverName: userProfile.name } : r));
        else if (type === 'ot_final') setOvertimeRequests(overtimeRequests.map(r => r.id === item.id ? { ...r, finalApprovalStatus: 'rejected', rejectionReason, finalApproverName: userProfile.name } : r));
        else if (type === 'outing') setOutingRequests(outingRequests.map(r => r.id === item.id ? { ...r, status: 'rejected', rejectionReason, approverName: userProfile.name } : r));
        setRejectModal(null);
        setRejectionReason('');
        triggerToast('已駁回申請！');
      };

      const handleDeleteReviewedItem = (type, id) => {
        if (userProfile.role !== 'admin') return alert('權限不足：只有【系統管理者】才可以刪除已審核完畢的申請紀錄！');
        if (confirm('確定要刪除這筆已審核完畢的紀錄嗎？')) {
          if (type === 'leave') setLeaveRequests(leaveRequests.filter(r => r.id !== id));
          if (type === 'overtime') setOvertimeRequests(overtimeRequests.filter(r => r.id !== id));
          if (type === 'outing') setOutingRequests(outingRequests.filter(r => r.id !== id));
          triggerToast('已成功刪除該筆審核紀錄！');
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-envelope-open-text text-amber-500"></i> 待審核請假/銷假申請</h3>
            <div className="space-y-3">
              {pendingLeaves.length === 0 ? <p className="text-slate-400 text-sm text-center py-4 font-medium">目前無待處理請假申請</p> : pendingLeaves.map(req => (
                <div key={req.id} className="p-4 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center">
                  <div>
                    <div className="flex items-center gap-2"><span className="font-bold text-slate-800">{req.userName}</span><span className="text-xs bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-md">{req.leaveType}</span><span className="text-xs font-bold text-slate-600">{req.hours} 小時</span></div>
                    <p className="text-xs text-slate-500 mt-1">日期：{req.date} ({req.dayOfWeek}) {req.isFullDay ? '全日' : `${req.startTime}~${req.endTime}`}</p>
                  </div>
                  <div className="flex items-center gap-2"><button onClick={() => handleApproveLeave(req, req.status === 'cancel_pending')} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">核准</button><button onClick={() => setRejectModal({ type: 'leave', item: req })} className="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">駁回</button></div>
                </div>
              ))}
            </div>
          </div>
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-business-time text-indigo-500"></i> 待審核加班申請</h3>
            <div className="space-y-3">
              {pendingOvertimes.length === 0 ? <p className="text-slate-400 text-sm text-center py-4 font-medium">目前無待處理加班申請</p> : pendingOvertimes.map(req => {
                const isPre = req.preApprovalStatus === 'pending';
                return (
                  <div key={req.id} className="p-4 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center">
                    <div>
                      <div className="flex items-center gap-2"><span className="font-bold text-slate-800">{req.userName}</span><span className={`text-xs px-2 py-0.5 rounded-md font-bold ${isPre ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>{isPre ? '預審' : '複審'}</span></div>
                      <p className="text-xs text-slate-600 font-semibold mt-1">事由：{req.reason}</p>
                      <p className="text-xs text-slate-500 mt-0.5">日期：{req.date} | 預計：{req.planStart}~{req.planEnd} ({req.planHours}h) {!isPre && `| 實際下班：${req.actualClockOut}`}</p>
                    </div>
                    <div className="flex items-center gap-2"><button onClick={() => handleApproveOvertime(req, isPre ? 'pre' : 'final')} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">核准</button><button onClick={() => setRejectModal({ type: isPre ? 'ot_pre' : 'ot_final', item: req })} className="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">駁回</button></div>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-person-walking-luggage text-emerald-500"></i> 待審核外出申請</h3>
            <div className="space-y-3">
              {pendingOutings.length === 0 ? <p className="text-slate-400 text-sm text-center py-4 font-medium">目前無待處理外出申請</p> : pendingOutings.map(req => (
                <div key={req.id} className="p-4 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center">
                  <div>
                    <div className="flex items-center gap-2"><span className="font-bold text-slate-800">{req.userName}</span><span className="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-md">外出 {req.hours}h</span></div>
                    <p className="text-xs text-slate-600 font-semibold mt-1">事由：{req.reason}</p>
                  </div>
                  <div className="flex items-center gap-2"><button onClick={() => handleApproveOuting(req)} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">核准</button><button onClick={() => setRejectModal({ type: 'outing', item: req })} className="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">駁回</button></div>
                </div>
              ))}
            </div>
          </div>
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-clock-rotate-left text-blue-600"></i> 已審核紀錄歷史 (僅系統管理員可刪除)</h3>
            <div className="flex gap-2 border-b border-slate-200 mb-4">
              <button onClick={() => setHistoryTab('leave')} className={`pb-2 px-3 text-xs font-bold border-b-2 transition ${historyTab === 'leave' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'}`}>請假紀錄 ({reviewedLeaves.length})</button>
              <button onClick={() => setHistoryTab('overtime')} className={`pb-2 px-3 text-xs font-bold border-b-2 transition ${historyTab === 'overtime' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'}`}>加班紀錄 ({reviewedOvertimes.length})</button>
              <button onClick={() => setHistoryTab('outing')} className={`pb-2 px-3 text-xs font-bold border-b-2 transition ${historyTab === 'outing' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'}`}>外出紀錄 ({reviewedOutings.length})</button>
            </div>
            <div className="overflow-x-auto">
              {historyTab === 'leave' && (
                <table className="w-full text-left text-sm text-slate-600">
                  <thead className="bg-slate-50 text-slate-700 uppercase font-bold text-xs border-b"><tr><th className="py-2.5 px-3">申請人</th><th className="py-2.5 px-3">日期</th><th className="py-2.5 px-3">假別</th><th className="py-2.5 px-3">時數</th><th className="py-2.5 px-3">狀態</th><th className="py-2.5 px-3 text-right">操作</th></tr></thead>
                  <tbody className="divide-y divide-slate-100">
                    {reviewedLeaves.map(r => (
                      <tr key={r.id} className="hover:bg-slate-50">
                        <td className="py-2.5 px-3 font-bold text-slate-800">{r.userName}</td>
                        <td className="py-2.5 px-3">{r.date}</td><td className="py-2.5 px-3">{r.leaveType}</td><td className="py-2.5 px-3 font-bold">{r.hours} h</td>
                        <td className="py-2.5 px-3"><StatusBadge status={r.status} approverName={r.approverName} /></td>
                        <td className="py-2.5 px-3 text-right">{userProfile.role === 'admin' && <button onClick={() => handleDeleteReviewedItem('leave', r.id)} className="text-xs bg-red-100 text-red-700 px-2.5 py-1 rounded font-bold">刪除</button>}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
              {historyTab === 'overtime' && (
                <table className="w-full text-left text-sm text-slate-600">
                  <thead className="bg-slate-50 text-slate-700 uppercase font-bold text-xs border-b"><tr><th className="py-2.5 px-3">申請人</th><th className="py-2.5 px-3">日期</th><th className="py-2.5 px-3">事由</th><th className="py-2.5 px-3">時數</th><th className="py-2.5 px-3">狀態</th><th className="py-2.5 px-3 text-right">操作</th></tr></thead>
                  <tbody className="divide-y divide-slate-100">
                    {reviewedOvertimes.map(r => (
                      <tr key={r.id} className="hover:bg-slate-50">
                        <td className="py-2.5 px-3 font-bold text-slate-800">{r.userName}</td>
                        <td className="py-2.5 px-3">{r.date}</td><td className="py-2.5 px-3 text-xs">{r.reason}</td><td className="py-2.5 px-3 font-bold">{r.actualHours || r.planHours} h</td>
                        <td className="py-2.5 px-3"><StatusBadge status={r.finalApprovalStatus !== 'none' ? r.finalApprovalStatus : r.preApprovalStatus} /></td>
                        <td className="py-2.5 px-3 text-right">{userProfile.role === 'admin' && <button onClick={() => handleDeleteReviewedItem('overtime', r.id)} className="text-xs bg-red-100 text-red-700 px-2.5 py-1 rounded font-bold">刪除</button>}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
              {historyTab === 'outing' && (
                <table className="w-full text-left text-sm text-slate-600">
                  <thead className="bg-slate-50 text-slate-700 uppercase font-bold text-xs border-b"><tr><th className="py-2.5 px-3">申請人</th><th className="py-2.5 px-3">日期</th><th className="py-2.5 px-3">事由</th><th className="py-2.5 px-3">時數</th><th className="py-2.5 px-3">狀態</th><th className="py-2.5 px-3 text-right">操作</th></tr></thead>
                  <tbody className="divide-y divide-slate-100">
                    {reviewedOutings.map(r => (
                      <tr key={r.id} className="hover:bg-slate-50">
                        <td className="py-2.5 px-3 font-bold text-slate-800">{r.userName}</td>
                        <td className="py-2.5 px-3">{r.date}</td><td className="py-2.5 px-3 text-xs">{r.reason}</td><td className="py-2.5 px-3 font-bold">{r.hours} h</td>
                        <td className="py-2.5 px-3"><StatusBadge status={r.status} approverName={r.approverName} /></td>
                        <td className="py-2.5 px-3 text-right">{userProfile.role === 'admin' && <button onClick={() => handleDeleteReviewedItem('outing', r.id)} className="text-xs bg-red-100 text-red-700 px-2.5 py-1 rounded font-bold">刪除</button>}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>
          {rejectModal && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
                <h4 className="font-bold text-slate-800 text-lg">駁回申請</h4>
                <div><label className="block text-xs font-bold text-slate-700 mb-1">駁回原因</label><textarea rows="3" value={rejectionReason} onChange={e => setRejectionReason(e.target.value)} className="w-full px-3 py-2 border rounded-xl" placeholder="說明駁回原因..."></textarea></div>
                <div className="flex justify-end gap-2"><button onClick={() => setRejectModal(null)} className="px-4 py-2 border rounded-xl text-slate-600">取消</button><button onClick={handleRejectSubmit} className="px-4 py-2 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700">確定駁回</button></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function EmployeeManagementView({ usersList, setUsersList, holidaysList, setHolidaysList, triggerToast }) {
      const [newClockId, setNewClockId] = useState('');
      const [newName, setNewName] = useState('');
      const [newTitle, setNewTitle] = useState('');
      const [newGender, setNewGender] = useState('male');
      const [newOnboardDate, setNewOnboardDate] = useState(new Date().toISOString().split('T')[0]);
      const [newPassword, setNewPassword] = useState('123456');
      const [showNewPassword, setShowNewPassword] = useState(false);
      const [newRole, setNewRole] = useState('staff');
      const [editingUser, setEditingUser] = useState(null);

      const [syncYear, setSyncYear] = useState('2026');
      const [syncing, setSyncing] = useState(false);

      const handleFetchGovernmentHolidays = async () => {
        setSyncing(true);
        try {
          const response = await fetch(`https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/${syncYear}.json`);
          if (!response.ok) throw new Error('無法取得該年度政府行事曆資料');
          const data = await response.json();
          
          const formatted = data.map((item, idx) => {
            const raw = item.date;
            const formattedDate = `${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}`;
            let type = 'holiday';
            if (!item.isHoliday || item.description.includes('上班') || item.description.includes('補行')) {
              type = 'workday';
            }
            return {
              id: `api_${syncYear}_${idx}`,
              date: formattedDate,
              name: item.description || (item.isHoliday ? '放假' : '上班'),
              type: type
            };
          });

          setHolidaysList(formatted);
          triggerToast(`成功串接行政院人事行政總處 API！已載入 ${syncYear} 年度 ${formatted.length} 筆日曆資料。`);
        } catch (err) {
          alert('API 同步失敗：' + err.message);
        } finally {
          setSyncing(false);
        }
      };

      const handleCreateUser = (e) => {
        e.preventDefault();
        const trimmedClockId = newClockId.trim().toUpperCase();
        if (usersList.some(u => u.clockId.toUpperCase() === trimmedClockId)) return alert('代號已存在！');
        const newUser = {
          id: 'user_' + Date.now(),
          clockId: trimmedClockId,
          name: newName,
          title: newTitle,
          onboardDate: newOnboardDate,
          gender: newGender,
          password: newPassword,
          role: newRole,
          delegatedScopes: { leave: true, overtime: true, outing: true, holidays: true },
          compLeaveHours: 0
        };
        setUsersList([...usersList, newUser]);
        setNewClockId(''); setNewName(''); setNewTitle(''); setNewPassword('123456');
        triggerToast(`成功建立員工帳號：${newName}`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-2 flex items-center gap-2">
              <i className="fa-solid fa-cloud-arrow-down text-blue-500"></i> 行政院國定假日與補班日 API 自動串接

    function AdminReportsView({ userProfile, usersList, leaveRequests, overtimeRequests, outingRequests, holidaysList, clockLogs, setClockLogs }) {
      const [startDate, setStartDate] = useState('2026-10-01');
      const [endDate, setEndDate] = useState('2026-10-31');
      const [uploading, setUploading] = useState(false);
      const [anomalies, setAnomalies] = useState([]);
      const [uploadedRawData, setUploadedRawData] = useState([]);

      const runAnomalyDetection = (rawLogs) => {
        const activeLogs = rawLogs && rawLogs.length > 0 ? rawLogs : [];
        const results = [];
        const targetUsers = usersList.filter(u => u.role !== 'admin');

        targetUsers.forEach(u => {
          const userPunches = activeLogs.filter(l => (l.clockId || l['打卡機代號'] || l['代號']) === u.clockId);
          const datesMap = {};
          userPunches.forEach(p => {
            const pDate = p.date || p['日期'];
            if (!pDate || pDate < startDate || pDate > endDate) return;
            if (!datesMap[pDate]) datesMap[pDate] = [];
            datesMap[pDate].push(p.time || p['時間'] || p['打卡時間']);
          });

          let currTime = new Date(startDate).getTime();
          const endTimeVal = new Date(endDate).getTime();

          while (currTime <= endTimeVal) {
            const dObj = new Date(currTime);
            const dStr = `${dObj.getFullYear()}-${String(dObj.getMonth()+1).padStart(2,'0')}-${String(dObj.getDate()).padStart(2,'0')}`;
            
            const dayOfWeek = dObj.getDay();
            const holidayObj = holidaysList.find(h => h.date === dStr);

            let isWorkingDay = (dayOfWeek !== 0 && dayOfWeek !== 6);
            if (holidayObj) {
              if (holidayObj.type === 'workday') isWorkingDay = true;
              if (holidayObj.type === 'holiday') isWorkingDay = false;
            }

            const times = (datesMap[dStr] || []).sort();
            const morningIn = times[0];
            const lastOut = times[times.length - 1];

            const hasLeave = leaveRequests.some(r => r.userId === u.id && r.status === 'approved' && r.date === dStr);
            const hasOuting = outingRequests.some(r => r.userId === u.id && r.status === 'approved' && r.date === dStr);
            const hasOT = overtimeRequests.some(r => r.userId === u.id && r.finalApprovalStatus === 'approved' && r.date === dStr);

            if (isWorkingDay) {
              if (times.length < 3 && !hasLeave && !hasOuting) {
                results.push({ clockId: u.clockId, name: u.name, date: dStr, type: '打卡次數不足/漏刷', desc: `工作日打卡僅 ${times.length} 次，未達標準 3 次且無核准假單`, severity: 'high' });
              }
              if (morningIn && morningIn > "09:15" && !hasLeave) {
                results.push({ clockId: u.clockId, name: u.name, date: dStr, type: '遲到異常', desc: `上班刷卡 (${morningIn}) 超過 09:15 彈性時間`, severity: 'high' });
              }
              if (lastOut && lastOut > "19:00" && !hasOT) {
                results.push({ clockId: u.clockId, name: u.name, date: dStr, type: '未報備加班', desc: `下班刷卡時間 (${lastOut}) 超過 19:00 且未經核准加班申請`, severity: 'medium' });
              }
            } else {
              if (times.length > 0 && !hasOT) {
                results.push({ clockId: u.clockId, name: u.name, date: dStr, type: '假日打卡未報備', desc: `非工作日出現刷卡紀錄 (${times.join(', ')}) 但未有核准加班單`, severity: 'medium' });
              }
            }

            currTime += 24 * 3600 * 1000;
          }
        });

        setAnomalies(results);
      };

      useEffect(() => {
        runAnomalyDetection(uploadedRawData);
      }, [usersList, leaveRequests, overtimeRequests, outingRequests, holidaysList, uploadedRawData, startDate, endDate]);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);
            setUploadedRawData(jsonData);
            runAnomalyDetection(jsonData);
            alert(`打卡紀錄上傳成功！已解析 ${jsonData.length} 筆，系統已自動完成異常比對。`);
          } catch (err) {
            alert('解析失敗: ' + err.message);
          } finally {
            setUploading(false);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const handleExportExcel = () => {
        const wb = XLSX.utils.book_new();
        const summaryData = usersList.map(u => {
          const uLeaves = leaveRequests.filter(r => r.userId === u.id && r.status === 'approved' && r.date >= startDate && r.date <= endDate);
          const uOT = overtimeRequests.filter(r => r.userId === u.id && r.finalApprovalStatus === 'approved' && r.date >= startDate && r.date <= endDate);
          const uOuting = outingRequests.filter(r => r.userId === u.id && r.status === 'approved' && r.date >= startDate && r.date <= endDate);
          return {
            '代號': u.clockId, '姓名': u.name, '職稱': u.title || '—',
            '請假總時數': uLeaves.reduce((a,b)=>a+b.hours,0),
            '加班總時數': uOT.reduce((a,b)=>a+(b.actualHours||b.planHours),0),
            '外出總時數': uOuting.reduce((a,b)=>a+b.hours,0)
          };
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryData), "全公司統計總表");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(uploadedRawData), "打卡機原始紀錄");

        const startTs = new Date(startDate).getTime();
        const endTs = new Date(endDate).getTime();

        usersList.forEach(u => {
          const rows = [];
          rows.push({ A: `姓名: ${u.name}`, B: `代號: ${u.clockId}`, C: `期間: ${startDate} ~ ${endDate}` });
          rows.push({});
          rows.push({ A: '日期', B: '星期', C: '打卡時間記錄', D: '考勤狀態與申請備註' });

          const userPunches = uploadedRawData.filter(l => (l.clockId || l['打卡機代號'] || l['代號']) === u.clockId);
          let curr = startTs;
          while (curr <= endTs) {
            const dObj = new Date(curr);
            const dStr = `${dObj.getFullYear()}-${String(dObj.getMonth()+1).padStart(2,'0')}-${String(dObj.getDate()).padStart(2,'0')}`;
            const dayOfWeek = getDayOfWeekStr(dStr);

            const dayPunches = userPunches.filter(p => (p.date || p['日期']) === dStr).map(p => p.time || p['時間'] || p['打卡時間']).filter(Boolean).sort();
            const timeStr = dayPunches.length ? dayPunches.join(', ') : '無打卡紀錄';

            const mLeave = leaveRequests.find(r => r.userId === u.id && r.date === dStr && r.status === 'approved');
            const mOT = overtimeRequests.find(r => r.userId === u.id && r.date === dStr && r.finalApprovalStatus === 'approved');
            const mOuting = outingRequests.find(r => r.userId === u.id && r.date === dStr && r.status === 'approved');

            let statusNote = '正常出勤';
            if (mLeave) statusNote = `請假: ${mLeave.leaveType} (${mLeave.hours}h)`;
            else if (mOT) statusNote = `加班: ${mOT.actualHours||mOT.planHours}h`;
            else if (mOuting) statusNote = `外出: ${mOuting.hours}h`;
            else if (dayPunches.length < 3 && dayOfWeek !== '星期六' && dayOfWeek !== '星期日') statusNote = '異常/漏打卡';

            rows.push({ A: dStr, B: dayOfWeek, C: timeStr, D: statusNote });
            curr += 24 * 3600 * 1000;
          }

          const ws = XLSX.utils.json_to_sheet(rows, { skipHeader: true });
          XLSX.utils.book_append_sheet(wb, ws, `${u.clockId}_${u.name}`.substring(0,31));
        });

        XLSX.writeFile(wb, `TASO_考勤完整報表_${startDate}_to_${endDate}.xlsx`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-file-excel text-emerald-600"></i> 考勤回朔報表與打卡上傳比對</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="p-4 bg-slate-50 border rounded-xl space-y-3">
                <h4 className="font-bold text-slate-700 text-sm">1. 選擇回朔統計期間與上傳打卡檔</h4>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block text-[11px] font-bold text-slate-500 mb-1">起始日期</label><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="px-3 py-1.5 border rounded-xl text-xs w-full font-bold" /></div>
                  <div><label className="block text-[11px] font-bold text-slate-500 mb-1">結束日期</label><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="px-3 py-1.5 border rounded-xl text-xs w-full font-bold" /></div>
                </div>
                <div><label className="block text-xs font-bold text-slate-500 mb-1">上傳打卡紀錄檔 (.xlsx / .csv)</label><input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} disabled={uploading} className="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700" /></div>
              </div>
              <div className="p-4 bg-blue-50 border border-blue-100 rounded-xl flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-blue-900 text-sm">2. 匯出多頁籤完整報表</h4>
                  <p className="text-xs text-blue-700 mt-1">包含全公司總表、打卡原始檔及每位員工的獨立逐日分頁。</p>
                </div>
                <button onClick={handleExportExcel} className="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl shadow flex items-center justify-center gap-2">
                  <i className="fa-solid fa-download"></i> 下載所選期間完整報表
                </button>
              </div>
            </div>
          </div>
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-triangle-exclamation text-amber-500"></i> 出勤異常比對結果 ({startDate} ~ {endDate})</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm text-slate-600">
                <thead className="bg-slate-50 text-slate-700 uppercase font-bold text-xs border-b"><tr><th className="py-3 px-4">代號</th><th className="py-3 px-4">姓名</th><th className="py-3 px-4">日期</th><th className="py-3 px-4">異常類型</th><th className="py-3 px-4">詳細說明</th></tr></thead>
                <tbody className="divide-y divide-slate-100">
                  {anomalies.length === 0 ? <tr><td colSpan="5" className="text-center py-6 text-slate-400 font-medium">太棒了！所選區間未發現任何出勤異常紀錄。</td></tr> : anomalies.map((item, idx) => (
                    <tr key={idx} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-mono font-bold">{item.clockId}</td>
                      <td className="py-3 px-4 font-bold">{item.name}</td>
                      <td className="py-3 px-4 font-semibold">{item.date}</td>
                      <td className="py-3 px-4"><span className="text-xs px-2 py-0.5 rounded font-bold bg-red-100 text-red-800">{item.type}</span></td>
                      <td className="py-3 px-4 text-xs font-medium">{item.desc}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function StatusBadge({ status, approverName }) {
      const config = {
        pending: { label: '待審核', class: 'bg-amber-100 text-amber-800' },
        approved: { label: '已核准', class: 'bg-emerald-100 text-emerald-800' },
        rejected: { label: '已被駁回', class: 'bg-red-100 text-red-800' },
        cancel_pending: { label: '銷假待審', class: 'bg-purple-100 text-purple-800' },
        cancelled: { label: '已銷假', class: 'bg-slate-200 text-slate-700' }
      };
      const conf = config[status] || { label: status, class: 'bg-slate-100 text-slate-800' };
      return (
        <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full inline-flex items-center gap-1 ${conf.class}`}>
          <span>{conf.label}</span>
          {status === 'approved' && approverName && <span className="text-[10px] opacity-80">({approverName})</span>}
        </span>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
