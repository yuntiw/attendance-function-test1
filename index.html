<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業電子考勤與休假管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS (xlsx) 用於 Excel 匯出與解析 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // 1. Firebase 初始化設定 (請替換為您的 Firebase 專案設定)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 初始化 Firebase (若未初始化)
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // =========================================================================
    // 2. 工具函式：年資與勞基法特休計算
    // =========================================================================
    function getDayOfWeekStr(dateStr) {
      if (!dateStr) return '';
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? '' : `星期${days[d.getDay()]}`;
    }

    function calculateSeniority(onboardDateStr) {
      if (!onboardDateStr) return { str: '未提供', totalMonths: 0 };
      const start = new Date(onboardDateStr);
      const now = new Date();
      if (isNaN(start.getTime())) return { str: '無效日期', totalMonths: 0 };

      let years = now.getFullYear() - start.getFullYear();
      let months = now.getMonth() - start.getMonth();
      let days = now.getDate() - start.getDate();

      if (days < 0) {
        months -= 1;
        const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        days += prevMonthLastDay;
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      const totalMonths = years * 12 + months;
      return {
        str: `${years} 年 ${months} 個月 ${days} 天`,
        years,
        months,
        totalMonths
      };
    }

    // 台灣勞基法特休對照表 (小時)
    function calculateAnnualLeaveHours(onboardDateStr) {
      const { totalMonths } = calculateSeniority(onboardDateStr);
      if (totalMonths < 6) return 0;
      if (totalMonths < 12) return 3 * 8;   // 6個月~1年: 3天
      if (totalMonths < 24) return 7 * 8;   // 1~2年: 7天
      if (totalMonths < 36) return 10 * 8;  // 2~3年: 10天
      if (totalMonths < 48) return 14 * 8;  // 3~4年: 14天
      if (totalMonths < 60) return 15 * 8;  // 4~5年: 15天
      const years = Math.floor(totalMonths / 12);
      const days = Math.min(15 + (years - 5), 30); // 5年以上每年+1天，最多30天
      return days * 8;
    }

    // =========================================================================
    // 3. 主應用程式組件
    // =========================================================================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('profile');

      // 全域資料庫狀態 (即時同步)
      const [usersList, setUsersList] = useState([]);
      const [leaveRequests, setLeaveRequests] = useState([]);
      const [overtimeRequests, setOvertimeRequests] = useState([]);
      const [clockLogs, setClockLogs] = useState([]);

      // 監聽 Auth 狀態
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(async (user) => {
          if (user) {
            setCurrentUser(user);
            fetchUserProfile(user.uid);
          } else {
            setCurrentUser(null);
            setUserProfile(null);
            setLoading(false);
          }
        });
        return () => unsubscribe();
      }, []);

      // 取得個人 Profile 並設定 Firestore 即時監聽
      const fetchUserProfile = (uid) => {
        db.collection('users').doc(uid).onSnapshot((doc) => {
          if (doc.exists) {
            setUserProfile({ id: doc.id, ...doc.data() });
          } else {
            // 新使用者建立預設 Profile
            const defaultProfile = {
              name: auth.currentUser.displayName || '新員工',
              title: '專員',
              gender: 'male',
              onboardDate: new Date().toISOString().split('T')[0],
              clockId: 'C' + Math.floor(1000 + Math.random() * 9000),
              role: 'staff', // staff, delegated_admin, admin
              lineUserId: '',
              compLeaveHours: 0
            };
            db.collection('users').doc(uid).set(defaultProfile);
            setUserProfile({ id: uid, ...defaultProfile });
          }
          setLoading(false);
        });
      };

      // 即時同步 Firestore 數據
      useEffect(() => {
        if (!userProfile) return;

        // 1. 同步使用者列表
        const unsubUsers = db.collection('users').onSnapshot(snap => {
          setUsersList(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        // 2. 同步請假申請
        const unsubLeaves = db.collection('leave_requests').onSnapshot(snap => {
          const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setLeaveRequests(list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)));
        });

        // 3. 同步加班申請
        const unsubOvertimes = db.collection('overtime_requests').onSnapshot(snap => {
          const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setOvertimeRequests(list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)));
        });

        // 4. 同步打卡紀錄
        const unsubClock = db.collection('clock_logs').onSnapshot(snap => {
          setClockLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        return () => {
          unsubUsers();
          unsubLeaves();
          unsubOvertimes();
          unsubClock();
        };
      }, [userProfile]);

      // 登入處理 (以 Mock Google 登入或簡化登入為例)
      const handleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          await auth.signInWithPopup(provider);
        } catch (err) {
          alert('登入失敗: ' + err.message);
        }
      };

      const handleLogout = () => auth.signOut();

      if (loading) {
        return (
          <div class="flex h-screen items-center justify-center bg-slate-100">
            <div class="text-center">
              <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-3"></i>
              <p class="text-slate-600 font-medium">系統載入中，請稍候...</p>
            </div>
          </div>
        );
      }

      if (!currentUser || !userProfile) {
        return (
          <div class="flex min-h-screen items-center justify-center bg-slate-100 p-4">
            <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 text-center border border-slate-200">
              <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-user-clock"></i>
              </div>
              <h2 class="text-2xl font-bold text-slate-800 mb-2">企業電子考勤系統</h2>
              <p class="text-slate-500 mb-6 text-sm">請登入以進行考勤打卡、請假與加班申請</p>
              <button 
                onClick={handleLogin}
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-sm"
              >
                <i class="fa-brands fa-google"></i> 使用 Google 帳號登入
              </button>
            </div>
          </div>
        );
      }

      return (
        <div class="min-h-screen flex flex-col">
          <!-- 頂部導覽列 -->
          <header class="bg-slate-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div class="flex items-center space-x-3">
                <i class="fa-solid fa-clock-rotate-left text-blue-400 text-xl"></i>
                <span class="font-bold text-lg tracking-wide">考勤管理系統</span>
                <span class={`text-xs px-2 py-0.5 rounded-full font-semibold ${
                  userProfile.role === 'admin' ? 'bg-red-500 text-white' :
                  userProfile.role === 'delegated_admin' ? 'bg-amber-500 text-white' : 'bg-slate-700 text-slate-300'
                }`}>
                  {userProfile.role === 'admin' ? '系統管理者' : userProfile.role === 'delegated_admin' ? '授權管理員' : '行政人員'}
                </span>
              </div>
              <div class="flex items-center gap-4">
                <span class="text-sm text-slate-300 hidden md:inline">{userProfile.name} ({userProfile.title})</span>
                <button 
                  onClick={handleLogout}
                  class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded transition border border-slate-700"
                >
                  登出
                </button>
              </div>
            </div>
          </header>

          <!-- 功能頁籤分頁 -->
          <nav class="bg-white border-b border-slate-200 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 flex space-x-8 overflow-x-auto">
              <TabButton id="profile" icon="fa-user" label="個人資訊" activeTab={activeTab} setActiveTab={setActiveTab} />
              <TabButton id="leave" icon="fa-calendar-minus" label="請假申請" activeTab={activeTab} setActiveTab={setActiveTab} />
              <TabButton id="overtime" icon="fa-business-time" label="加班申請" activeTab={activeTab} setActiveTab={setActiveTab} />
              
              {(userProfile.role === 'admin' || userProfile.role === 'delegated_admin') && (
                <TabButton id="approval" icon="fa-clipboard-check" label="考勤審核" activeTab={activeTab} setActiveTab={setActiveTab} />
              )}
              
              {userProfile.role === 'admin' && (
                <TabButton id="admin" icon="fa-sliders" label="管理中心 (上傳/報表)" activeTab={activeTab} setActiveTab={setActiveTab} />
              )}
            </div>
          </nav>

          <!-- 主內容區 -->
          <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
            {activeTab === 'profile' && <ProfileView userProfile={userProfile} setUserProfile={setUserProfile} />}
            {activeTab === 'leave' && <LeaveView userProfile={userProfile} leaveRequests={leaveRequests} />}
            {activeTab === 'overtime' && <OvertimeView userProfile={userProfile} overtimeRequests={overtimeRequests} />}
            {activeTab === 'approval' && (userProfile.role === 'admin' || userProfile.role === 'delegated_admin') && (
              <ApprovalView userProfile={userProfile} leaveRequests={leaveRequests} overtimeRequests={overtimeRequests} usersList={usersList} />
            )}
            {activeTab === 'admin' && userProfile.role === 'admin' && (
              <AdminView usersList={usersList} leaveRequests={leaveRequests} overtimeRequests={overtimeRequests} clockLogs={clockLogs} />
            )}
          </main>
        </div>
      );
    }

    function TabButton({ id, icon, label, activeTab, setActiveTab }) {
      const active = activeTab === id;
      return (
        <button
          onClick={() => setActiveTab(id)}
          class={`flex items-center gap-2 py-3 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors ${
            active ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
          }`}
        >
          <i class={`fa-solid ${icon}`}></i> {label}
        </button>
      );
    }

    // =========================================================================
    // 4. 子頁面：個人資訊 (功能 2)
    // =========================================================================
    function ProfileView({ userProfile, setUserProfile }) {
      const [form, setForm] = useState({ ...userProfile });
      const [isSaving, setIsSaving] = useState(false);

      const seniority = useMemo(() => calculateSeniority(userProfile.onboardDate), [userProfile.onboardDate]);
      const annualLeaveHours = useMemo(() => calculateAnnualLeaveHours(userProfile.onboardDate), [userProfile.onboardDate]);

      const handleSave = async (e) => {
        e.preventDefault();
        setIsSaving(true);
        try {
          await db.collection('users').doc(userProfile.id).update({
            name: form.name,
            title: form.title,
            gender: form.gender,
            onboardDate: form.onboardDate,
            clockId: form.clockId,
            lineUserId: form.lineUserId || ''
          });
          alert('個人資料已成功更新！');
        } catch (err) {
          alert('更新失敗: ' + err.message);
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- 特休/年資統計卡片 -->
          <div class="lg:col-span-1 space-y-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-chart-pie text-blue-500"></i> 當前假期統計
              </h3>
              <div class="space-y-4">
                <div class="p-4 bg-slate-50 rounded-lg border border-slate-100">
                  <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">累計年資</span>
                  <div class="text-xl font-bold text-slate-800 mt-1">{seniority.str}</div>
                </div>
                <div class="p-4 bg-blue-50 rounded-lg border border-blue-100">
                  <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">依法應有特休時數</span>
                  <div class="text-2xl font-black text-blue-700 mt-1">{annualLeaveHours} <span class="text-sm font-normal">小時</span></div>
                  <span class="text-xs text-blue-500">({(annualLeaveHours / 8).toFixed(1)} 天)</span>
                </div>
                <div class="p-4 bg-emerald-50 rounded-lg border border-emerald-100">
                  <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">可用補休時數</span>
                  <div class="text-2xl font-black text-emerald-700 mt-1">{userProfile.compLeaveHours || 0} <span class="text-sm font-normal">小時</span></div>
                </div>
              </div>
            </div>
          </div>

          <!-- 個人資料編輯表單 -->
          <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-id-card text-blue-500"></i> 基本資料設定
            </h3>
            <form onSubmit={handleSave} class="space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">姓名</label>
                  <input type="text" required value={form.name} onChange={e => setForm({...form, name: e.target.value})} class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">職稱</label>
                  <input type="text" required value={form.title} onChange={e => setForm({...form, title: e.target.value})} class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">性別</label>
                  <select value={form.gender} onChange={e => setForm({...form, gender: e.target.value})} class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="male">男性</option>
                    <option value="female">女性</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">入職日期</label>
                  <input type="date" required value={form.onboardDate} onChange={e => setForm({...form, onboardDate: e.target.value})} class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">打卡機代號</label>
                  <input type="text" required value={form.clockId} onChange={e => setForm({...form, clockId: e.target.value})} class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">綁定 LINE User ID</label>
                  <input type="text" placeholder="例如: U1234567890abcdef..." value={form.lineUserId} onChange={e => setForm({...form, lineUserId: e.target.value})} class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                  <span class="text-xs text-slate-400">超時未審核時自動透過 LINE 發送提醒通知</span>
                </div>
              </div>
              <div class="pt-4 flex justify-end">
                <button type="submit" disabled={isSaving} class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition shadow-sm">
                  {isSaving ? '儲存中...' : '儲存變更'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 5. 子頁面：請假功能 (功能 3, 4)
    // =========================================================================
    function LeaveView({ userProfile, leaveRequests }) {
      const myRequests = leaveRequests.filter(r => r.userId === userProfile.id);

      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [isFullDay, setIsFullDay] = useState(false);
      const [startTime, setStartTime] = useState('09:00');
      const [endTime, setEndTime] = useState('18:00');
      const [leaveType, setLeaveType] = useState('特休');
      const [cancelModalItem, setCancelModalItem] = useState(null);
      const [cancelReason, setCancelReason] = useState('');

      const dayOfWeek = useMemo(() => getDayOfWeekStr(date), [date]);

      // 自動計算時數
      const calculatedHours = useMemo(() => {
        if (isFullDay) return 8;
        const startH = parseInt(startTime.split(':')[0]);
        const endH = parseInt(endTime.split(':')[0]);
        let diff = endH - startH;
        // 若跨午休 12:00-13:00，自動扣除 1 小時
        if (startH <= 12 && endH >= 13) diff -= 1;
        return diff > 0 ? diff : 0;
      }, [isFullDay, startTime, endTime]);

      // 送出請假申請
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (calculatedHours <= 0) {
          alert('請假起訖時間選擇不正確！');
          return;
        }

        try {
          await db.collection('leave_requests').add({
            userId: userProfile.id,
            userName: userProfile.name,
            date,
            dayOfWeek,
            startTime: isFullDay ? '09:00' : startTime,
            endTime: isFullDay ? '18:00' : endTime,
            isFullDay,
            leaveType,
            hours: calculatedHours,
            status: 'pending', // pending, approved, rejected, cancel_pending, cancelled
            rejectionReason: '',
            cancelReason: '',
            approverName: '',
            createdAt: new Date().toISOString()
          });
          alert('請假申請已送出！');
        } catch (err) {
          alert('送出失敗: ' + err.message);
        }
      };

      // 再次送出修改 (被駁回後)
      const handleResubmit = async (req) => {
        try {
          await db.collection('leave_requests').doc(req.id).update({
            status: 'pending',
            rejectionReason: '',
            createdAt: new Date().toISOString()
          });
          alert('已重新送出審核！');
        } catch (err) {
          alert('操作失敗: ' + err.message);
        }
      };

      // 申請銷假
      const handleCancelSubmit = async () => {
        if (!cancelReason) return alert('請填寫銷假原因！');
        try {
          await db.collection('leave_requests').doc(cancelModalItem.id).update({
            status: 'cancel_pending',
            cancelReason
          });
          alert('銷假申請已送出審核！');
          setCancelModalItem(null);
          setCancelReason('');
        } catch (err) {
          alert('送出失敗: ' + err.message);
        }
      };

      return (
        <div class="space-y-6">
          <!-- 請假申請表單 -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-file-pen text-blue-500"></i> 新增請假申請
            </h3>
            <form onSubmit={handleSubmit} class="space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">申請人姓名</label>
                  <input type="text" disabled value={userProfile.name} class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-lg text-slate-600" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">請假日期</label>
                  <div class="flex items-center gap-2">
                    <input type="date" required value={date} onChange={e => setDate(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    <span class="text-sm font-bold text-blue-600 whitespace-nowrap min-w-[60px]">{dayOfWeek}</span>
                  </div>
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">假別</label>
                  <select value={leaveType} onChange={e => setLeaveType(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="特休">特休</option>
                    <option value="補休">補休</option>
                    <option value="事假">事假</option>
                    <option value="喪假">喪假</option>
                    <option value="婚假">婚假</option>
                    {userProfile.gender === 'female' && <option value="生理假">生理假 (女性專屬)</option>}
                  </select>
                </div>
              </div>

              <!-- 時間選擇 -->
              <div class="flex items-center gap-4 pt-2">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={isFullDay} onChange={e => setIsFullDay(e.target.checked)} class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500" />
                  <span class="text-sm font-semibold text-slate-700">全日 (8小時)</span>
                </label>
              </div>

              {!isFullDay && (
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">開始時間 (09:00 - 18:00)</label>
                    <select value={startTime} onChange={e => setStartTime(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                      {['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'].map(t => (
                        <option key={t} value={t}>{t}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">結束時間 (09:00 - 18:00)</label>
                    <select value={endTime} onChange={e => setEndTime(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                      {['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'].map(t => (
                        <option key={t} value={t}>{t}</option>
                      ))}
                    </select>
                  </div>
                </div>
              )}

              <div class="flex justify-between items-center pt-2">
                <div class="text-sm font-medium text-slate-600">
                  預計扣除/請假時數: <span class="text-lg font-bold text-blue-600">{calculatedHours}</span> 小時
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition shadow-sm">
                  送出請假申請
                </button>
              </div>
            </form>
          </div>

          <!-- 請假紀錄列表 -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-clock-rotate-left text-blue-500"></i> 我的請假紀錄
            </h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-slate-50 text-slate-700 uppercase font-semibold text-xs border-b border-slate-200">
                  <tr>
                    <th class="py-3 px-4">日期 (星期)</th>
                    <th class="py-3 px-4">時段</th>
                    <th class="py-3 px-4">假別</th>
                    <th class="py-3 px-4">時數</th>
                    <th class="py-3 px-4">核准狀態</th>
                    <th class="py-3 px-4">核准人</th>
                    <th class="py-3 px-4 text-right">操作</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  {myRequests.length === 0 ? (
                    <tr><td colSpan="7" class="text-center py-6 text-slate-400">尚無請假紀錄</td></tr>
                  ) : myRequests.map(req => (
                    <tr key={req.id} class="hover:bg-slate-50">
                      <td class="py-3 px-4 font-medium">{req.date} ({req.dayOfWeek})</td>
                      <td class="py-3 px-4">{req.isFullDay ? '全日' : `${req.startTime} ~ ${req.endTime}`}</td>
                      <td class="py-3 px-4"><span class="px-2 py-0.5 bg-slate-100 rounded text-slate-700">{req.leaveType}</span></td>
                      <td class="py-3 px-4 font-bold">{req.hours} h</td>
                      <td class="py-3 px-4">
                        <StatusBadge status={req.status} />
                        {req.status === 'rejected' && <p class="text-xs text-red-500 mt-1">原因: {req.rejectionReason}</p>}
                      </td>
                      <td class="py-3 px-4 text-slate-500">{req.approverName || '-'}</td>
                      <td class="py-3 px-4 text-right">
                        {req.status === 'rejected' && (
                          <button onClick={() => handleResubmit(req)} class="text-xs bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded">修改重送</button>
                        )}
                        {req.status === 'approved' && (
                          <button onClick={() => setCancelModalItem(req)} class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1 rounded">申請銷假</button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <!-- 銷假 Modal -->
          {cancelModalItem && (
            <div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
                <h4 class="font-bold text-slate-800 text-lg">申請銷假</h4>
                <p class="text-sm text-slate-600">日期：{cancelModalItem.date} ({cancelModalItem.hours}小時 {cancelModalItem.leaveType})</p>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">銷假原因</label>
                  <textarea rows="3" value={cancelReason} onChange={e => setCancelReason(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="請說明銷假原因..."></textarea>
                </div>
                <div class="flex justify-end gap-2">
                  <button onClick={() => setCancelModalItem(null)} class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600">取消</button>
                  <button onClick={handleCancelSubmit} class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">送出銷假申請</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 6. 子頁面：加班功能 (功能 5 兩階段加班)
    // =========================================================================
    function OvertimeView({ userProfile, overtimeRequests }) {
      const myRequests = overtimeRequests.filter(r => r.userId === userProfile.id);

      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [planStart, setPlanStart] = useState('18:00');
      const [planEnd, setPlanEnd] = useState('20:00');
      const [planHours, setPlanHours] = useState(2);

      // 實際報銷 modal
      const [actualModalItem, setActualModalItem] = useState(null);
      const [actualClockOut, setActualClockOut] = useState('20:00');
      const [actualHours, setActualHours] = useState(2);

      const dayOfWeek = useMemo(() => getDayOfWeekStr(date), [date]);

      // 第一階段：預先申請
      const handlePlanSubmit = async (e) => {
        e.preventDefault();
        try {
          await db.collection('overtime_requests').add({
            userId: userProfile.id,
            userName: userProfile.name,
            date,
            dayOfWeek,
            planStart,
            planEnd,
            planHours: Number(planHours),
            preApprovalStatus: 'pending', // pending, approved, rejected
            preApproverName: '',
            actualClockOut: '',
            actualHours: 0,
            finalApprovalStatus: 'none', // none, pending, approved, rejected
            finalApproverName: '',
            rejectionReason: '',
            createdAt: new Date().toISOString()
          });
          alert('加班預先申請已送出！');
        } catch (err) {
          alert('送出失敗: ' + err.message);
        }
      };

      // 第二階段：填寫實際時間與時數
      const handleActualSubmit = async () => {
        try {
          await db.collection('overtime_requests').doc(actualModalItem.id).update({
            actualClockOut,
            actualHours: Number(actualHours),
            finalApprovalStatus: 'pending'
          });
          alert('實際加班時數已送出複審！');
          setActualModalItem(null);
        } catch (err) {
          alert('送出失敗: ' + err.message);
        }
      };

      return (
        <div class="space-y-6">
          <!-- 階段一：預先申請表單 -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-briefcase text-blue-500"></i> 第一階段：預先申請加班
            </h3>
            <form onSubmit={handlePlanSubmit} class="space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">申請日期</label>
                  <div class="flex items-center gap-1">
                    <input type="date" required value={date} onChange={e => setDate(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                    <span class="text-xs font-bold text-blue-600">{dayOfWeek}</span>
                  </div>
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">預計起時</label>
                  <input type="time" required value={planStart} onChange={e => setPlanStart(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">預計迄時</label>
                  <input type="time" required value={planEnd} onChange={e => setPlanEnd(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">預計時數 (小時)</label>
                  <input type="number" step="0.5" min="0.5" required value={planHours} onChange={e => setPlanHours(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
              </div>
              <div class="flex justify-end pt-2">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition shadow-sm">
                  送出預審申請
                </button>
              </div>
            </form>
          </div>

          <!-- 加班申請紀錄表 -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-list-check text-blue-500"></i> 我的加班紀錄與報銷進度
            </h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-slate-50 text-slate-700 uppercase font-semibold text-xs border-b border-slate-200">
                  <tr>
                    <th class="py-3 px-4">日期</th>
                    <th class="py-3 px-4">預計時段/時數</th>
                    <th class="py-3 px-4">預審狀態</th>
                    <th class="py-3 px-4">實際下班/時數</th>
                    <th class="py-3 px-4">複審狀態</th>
                    <th class="py-3 px-4 text-right">操作</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  {myRequests.length === 0 ? (
                    <tr><td colSpan="6" class="text-center py-6 text-slate-400">尚無加班紀錄</td></tr>
                  ) : myRequests.map(req => (
                    <tr key={req.id} class="hover:bg-slate-50">
                      <td class="py-3 px-4 font-medium">{req.date} ({req.dayOfWeek})</td>
                      <td class="py-3 px-4">{req.planStart}~{req.planEnd} ({req.planHours}h)</td>
                      <td class="py-3 px-4"><StatusBadge status={req.preApprovalStatus} /></td>
                      <td class="py-3 px-4">
                        {req.actualClockOut ? `${req.actualClockOut} (${req.actualHours}h)` : '-'}
                      </td>
                      <td class="py-3 px-4">
                        {req.finalApprovalStatus === 'none' ? <span class="text-xs text-slate-400">待預審核准</span> : <StatusBadge status={req.finalApprovalStatus} />}
                      </td>
                      <td class="py-3 px-4 text-right">
                        {req.preApprovalStatus === 'approved' && req.finalApprovalStatus !== 'approved' && (
                          <button onClick={() => { setActualModalItem(req); setActualClockOut(req.planEnd); setActualHours(req.planHours); }} class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded">
                            {req.finalApprovalStatus === 'rejected' ? '修改重送實際時間' : '填寫實際下班時間'}
                          </button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <!-- 第二階段 Modal -->
          {actualModalItem && (
            <div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
                <h4 class="font-bold text-slate-800 text-lg">第二階段：回報實際加班時間</h4>
                <p class="text-sm text-slate-600">日期：{actualModalItem.date} (預計 {actualModalItem.planHours} 小時)</p>
                <div class="space-y-3">
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">實際下班時間</label>
                    <input type="time" required value={actualClockOut} onChange={e => setActualClockOut(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">實際加班時數 (小時)</label>
                    <input type="number" step="0.5" min="0.5" required value={actualHours} onChange={e => setActualHours(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                  </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                  <button onClick={() => setActualModalItem(null)} class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600">取消</button>
                  <button onClick={handleActualSubmit} class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">送出複審</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 7. 子頁面：考勤審核 (功能 6, 7)
    // =========================================================================
    function ApprovalView({ userProfile, leaveRequests, overtimeRequests, usersList }) {
      const [rejectModal, setRejectModal] = useState(null); // { type: 'leave'|'ot_pre'|'ot_final', item }
      const [rejectionReason, setRejectionReason] = useState('');

      // 核准請假/銷假
      const handleApproveLeave = async (req, isCancel = false) => {
        try {
          const newStatus = isCancel ? 'cancelled' : 'approved';
          await db.collection('leave_requests').doc(req.id).update({
            status: newStatus,
            approverName: userProfile.name
          });

          // 若核准補休請假，自動扣除該使用者的補休時數
          if (newStatus === 'approved' && req.leaveType === '補休') {
            const userRef = db.collection('users').doc(req.userId);
            const targetUser = usersList.find(u => u.id === req.userId);
            const currentComp = targetUser?.compLeaveHours || 0;
            await userRef.update({ compLeaveHours: Math.max(0, currentComp - req.hours) });
          }

          alert('已核准！');
        } catch (err) {
          alert('操作失敗: ' + err.message);
        }
      };

      // 核准加班 (預審/複審)
      const handleApproveOvertime = async (req, stage) => {
        try {
          if (stage === 'pre') {
            await db.collection('overtime_requests').doc(req.id).update({
              preApprovalStatus: 'approved',
              preApproverName: userProfile.name
            });
          } else {
            await db.collection('overtime_requests').doc(req.id).update({
              finalApprovalStatus: 'approved',
              finalApproverName: userProfile.name
            });

            // 複審通過後，自動將加班時數轉為補休時數增加給使用者
            const userRef = db.collection('users').doc(req.userId);
            const targetUser = usersList.find(u => u.id === req.userId);
            const currentComp = targetUser?.compLeaveHours || 0;
            await userRef.update({ compLeaveHours: currentComp + (req.actualHours || req.planHours) });
          }
          alert('核准成功！');
        } catch (err) {
          alert('操作失敗: ' + err.message);
        }
      };

      // 執行駁回
      const handleRejectSubmit = async () => {
        if (!rejectionReason) return alert('請填寫駁回原因！');
        const { type, item } = rejectModal;
        try {
          if (type === 'leave') {
            await db.collection('leave_requests').doc(item.id).update({
              status: 'rejected',
              rejectionReason,
              approverName: userProfile.name
            });
          } else if (type === 'ot_pre') {
            await db.collection('overtime_requests').doc(item.id).update({
              preApprovalStatus: 'rejected',
              rejectionReason,
              preApproverName: userProfile.name
            });
          } else if (type === 'ot_final') {
            await db.collection('overtime_requests').doc(item.id).update({
              finalApprovalStatus: 'rejected',
              rejectionReason,
              finalApproverName: userProfile.name
            });
          }
          alert('已駁回！');
          setRejectModal(null);
          setRejectionReason('');
        } catch (err) {
          alert('操作失敗: ' + err.message);
        }
      };

      return (
        <div class="space-y-6">
          <!-- 請假/銷假待審核單據 -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-envelope-open-text text-amber-500"></i> 待審核請假/銷假單據
            </h3>
            <div class="space-y-3">
              {leaveRequests.filter(r => r.status === 'pending' || r.status === 'cancel_pending').length === 0 ? (
                <p class="text-slate-400 text-sm text-center py-4">目前無待處理請假申請</p>
              ) : (
                leaveRequests.filter(r => r.status === 'pending' || r.status === 'cancel_pending').map(req => (
                  <div key={req.id} class="p-4 bg-slate-50 border border-slate-200 rounded-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                      <div class="flex items-center gap-2">
                        <span class="font-bold text-slate-800">{req.userName}</span>
                        <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">{req.leaveType}</span>
                        <span class="text-xs font-semibold text-slate-500">{req.hours} 小時</span>
                        {req.status === 'cancel_pending' && <span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold">申請銷假中</span>}
                      </div>
                      <p class="text-xs text-slate-500 mt-1">日期：{req.date} ({req.dayOfWeek}) {req.isFullDay ? '全日' : `${req.startTime}~${req.endTime}`}</p>
                      {req.cancelReason && <p class="text-xs text-red-600 mt-1">銷假原因：{req.cancelReason}</p>}
                    </div>
                    <div class="flex items-center gap-2 self-end md:self-auto">
                      <button onClick={() => handleApproveLeave(req, req.status === 'cancel_pending')} class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded">
                        <i class="fa-solid fa-check mr-1"></i> 核准
                      </button>
                      <button onClick={() => setRejectModal({ type: 'leave', item: req })} class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-1.5 rounded">
                        <i class="fa-solid fa-xmark mr-1"></i> 駁回
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          <!-- 加班待審核單據 (預審與複審) -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-business-time text-indigo-500"></i> 待審核加班單據 (兩階段)
            </h3>
            <div class="space-y-3">
              {overtimeRequests.filter(r => r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending').length === 0 ? (
                <p class="text-slate-400 text-sm text-center py-4">目前無待處理加班申請</p>
              ) : (
                overtimeRequests.filter(r => r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending').map(req => {
                  const isPre = req.preApprovalStatus === 'pending';
                  return (
                    <div key={req.id} class="p-4 bg-slate-50 border border-slate-200 rounded-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="font-bold text-slate-800">{req.userName}</span>
                          <span className={`text-xs px-2 py-0.5 rounded font-semibold ${isPre ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                            {isPre ? '第一階段 (預審)' : '第二階段 (複審)'}
                          </span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1">
                          日期：{req.date} ({req.dayOfWeek}) | 預計：{req.planStart}~{req.planEnd} ({req.planHours}h)
                          {!isPre && <span class="text-slate-800 font-bold ml-2">實際下班：{req.actualClockOut} ({req.actualHours}h)</span>}
                        </p>
                      </div>
                      <div class="flex items-center gap-2 self-end md:self-auto">
                        <button onClick={() => handleApproveOvertime(req, isPre ? 'pre' : 'final')} class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded">
                          <i class="fa-solid fa-check mr-1"></i> 核准
                        </button>
                        <button onClick={() => setRejectModal({ type: isPre ? 'ot_pre' : 'ot_final', item: req })} class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-1.5 rounded">
                          <i class="fa-solid fa-xmark mr-1"></i> 駁回
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>

          <!-- 駁回 Reason Modal -->
          {rejectModal && (
            <div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
                <h4 class="font-bold text-slate-800 text-lg">退回/駁回申請</h4>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">請輸入駁回原因 (申請人可修改後重新送出)</label>
                  <textarea rows="3" value={rejectionReason} onChange={e => setRejectionReason(e.target.value)} class="w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="說明駁回原因..."></textarea>
                </div>
                <div class="flex justify-end gap-2">
                  <button onClick={() => setRejectModal(null)} class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600">取消</button>
                  <button onClick={handleRejectSubmit} class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">確定駁回</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 8. 子頁面：管理者頁面 (打卡記錄上傳 + Excel 匯出) (功能 8, 9)
    // =========================================================================
    function AdminView({ usersList, leaveRequests, overtimeRequests, clockLogs }) {
      const [selectedMonth, setSelectedMonth] = useState('2026-10');
      const [uploading, setUploading] = useState(false);

      // 上傳當月打卡 Excel/CSV 紀錄
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setUploading(true);
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            // 上傳至 Firestore clock_logs
            await db.collection('clock_logs').doc(selectedMonth).set({
              month: selectedMonth,
              logs: jsonData,
              updatedAt: new Date().toISOString()
            });

            alert(`月份 ${selectedMonth} 的打卡紀錄匯入成功！共 ${jsonData.length} 筆`);
          } catch (err) {
            alert('解析或匯入失敗: ' + err.message);
          } finally {
            setUploading(false);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      // 一鍵產生多 Tab Excel 報表
      const handleExportExcel = () => {
        const wb = XLSX.utils.book_new();

        // 1. 全公司彙整總表 Sheet
        const summaryData = usersList.map(u => {
          const uLeaves = leaveRequests.filter(r => r.userId === u.id && r.status === 'approved' && r.date.startsWith(selectedMonth));
          const uOT = overtimeRequests.filter(r => r.userId === u.id && r.finalApprovalStatus === 'approved' && r.date.startsWith(selectedMonth));
          
          const leaveHours = uLeaves.reduce((acc, r) => acc + r.hours, 0);
          const otHours = uOT.reduce((acc, r) => acc + (r.actualHours || r.planHours), 0);

          return {
            '打卡代號': u.clockId,
            '姓名': u.name,
            '職稱': u.title,
            '當月請假總時數': leaveHours,
            '當月加班總時數': otHours,
            '當前剩餘特休時數': calculateAnnualLeaveHours(u.onboardDate),
            '當前剩餘補休時數': u.compLeaveHours || 0
          };
        });
        const summaryWs = XLSX.utils.json_to_sheet(summaryData);
        XLSX.utils.book_append_sheet(wb, summaryWs, "全公司統計總表");

        // 2. 各使用者獨立分頁 Sheet
        usersList.forEach(u => {
          const uLeaves = leaveRequests.filter(r => r.userId === u.id && r.status === 'approved' && r.date.startsWith(selectedMonth));
          const uOT = overtimeRequests.filter(r => r.userId === u.id && r.finalApprovalStatus === 'approved' && r.date.startsWith(selectedMonth));

          const sheetRows = [];
          sheetRows.push({ A: `員工姓名: ${u.name}`, B: `職稱: ${u.title}`, C: `打卡機代號: ${u.clockId}` });
          sheetRows.push({ A: `結算特休時數: ${calculateAnnualLeaveHours(u.onboardDate)}`, B: `結算補休時數: ${u.compLeaveHours || 0}` });
          sheetRows.push({}); // 空行
          sheetRows.push({ A: '日期', B: '假別/出勤項目', C: '時數', D: '狀態', E: '備註' });

          uLeaves.forEach(l => {
            sheetRows.push({ A: l.date, B: `請假: ${l.leaveType}`, C: l.hours, D: '已核准', E: l.isFullDay ? '全日' : `${l.startTime}~${l.endTime}` });
          });
          uOT.forEach(o => {
            sheetRows.push({ A: o.date, B: '加班報銷', C: o.actualHours || o.planHours, D: '已核准', E: `實際下班 ${o.actualClockOut}` });
          });

          const userWs = XLSX.utils.json_to_sheet(sheetRows, { skipHeader: true });
          // 分頁名稱: 打卡代號_姓名
          const sheetName = `${u.clockId}_${u.name}`.substring(0, 31); // Excel 分頁最長 31 字元
          XLSX.utils.book_append_sheet(wb, userWs, sheetName);
        });

        // 匯出 .xlsx 檔案
        XLSX.writeFile(wb, `公司月度考勤結算表_${selectedMonth}.xlsx`);
      };

      return (
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-file-excel text-emerald-600"></i> 月份考勤上傳與報表產生
            </h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- 左邊：上傳考勤紀錄 -->
              <div class="p-4 bg-slate-50 border border-slate-200 rounded-lg space-y-3">
                <h4 class="font-bold text-slate-700 text-sm">1. 上傳當月打卡機紀錄</h4>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">選擇考勤月份</label>
                  <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} class="px-3 py-1.5 border border-slate-300 rounded text-sm w-full" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">上傳 Excel/CSV 檔案 (需包含: 打卡代號、日期、簽到/簽退)</label>
                  <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} disabled={uploading} class="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                </div>
              </div>

              <!-- 右邊：一鍵匯出 Excel -->
              <div class="p-4 bg-blue-50 border border-blue-100 rounded-lg flex flex-col justify-between">
                <div>
                  <h4 class="font-bold text-blue-900 text-sm">2. 產生當月 Excel 報表</h4>
                  <p class="text-xs text-blue-700 mt-1">系統將根據考勤數據、核准之請假與加班紀錄，自動為每位使用者獨立製作 Excel 分頁，並算清剩餘特休與補休時數。</p>
                </div>
                <button onClick={handleExportExcel} class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-lg transition shadow flex items-center justify-center gap-2">
                  <i class="fa-solid fa-download"></i> 一鍵匯出全公司 `.xlsx` 報表
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 狀態標籤 Component
    function StatusBadge({ status }) {
      const config = {
        pending: { label: '待審核', class: 'bg-amber-100 text-amber-800' },
        approved: { label: '已核准', class: 'bg-emerald-100 text-emerald-800' },
        rejected: { label: '已被駁回', class: 'bg-red-100 text-red-800' },
        cancel_pending: { label: '銷假待審', class: 'bg-purple-100 text-purple-800' },
        cancelled: { label: '已銷假', class: 'bg-slate-200 text-slate-700' }
      };
      const conf = config[status] || { label: status, class: 'bg-slate-100 text-slate-800' };
      return <span class={`text-xs font-semibold px-2 py-0.5 rounded ${conf.class}`}>{conf.label}</span>;
    }

    // 渲染 React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
