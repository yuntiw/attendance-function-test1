  <script type="text/babel">

    const firebaseConfig = {

      messagingSenderId: "276967647153",
      appId: "1:276967647153:web:6845f5fd391a26e0f63f90",
      measurementId: "G-0KF2L00BJK"
    };

    let auth = null;

    // 工具函式：自動觸發 LINE 通知給管理員
    function sendLineAdminNotification(title, content) {
      console.log(`[LINE 通知發送至管理員] ${title}: ${content}`);

    }

    // =========================================================================
    // 2. 工具函式：年資與勞基法特休計算
    // =========================================================================
    function getDayOfWeekStr(dateStr) {
      if (!dateStr) return '';
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? '' : `星期${days[d.getDay()]}`;
    }

    function calculateSeniority(onboardDateStr) {
      if (!onboardDateStr) return { str: '未提供', totalMonths: 0 };
      const start = new Date(onboardDateStr);
      const now = new Date();
      if (isNaN(start.getTime())) return { str: '無效日期', totalMonths: 0 };

      let years = now.getFullYear() - start.getFullYear();
      let months = now.getMonth() - start.getMonth();
      let days = now.getDate() - start.getDate();

      if (days < 0) {
        months -= 1;
        const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        days += prevMonthLastDay;
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      const totalMonths = Math.max(0, years * 12 + months);
      return {
        str: `${years > 0 ? years + ' 年 ' : ''}${Math.max(0, months)} 個月 ${Math.max(0, days)} 天`,
        years,
        months,
        totalMonths
      };
    }

    // 台灣勞基法特休對照表 (小時)
    function calculateAnnualLeaveHours(onboardDateStr) {
      const { totalMonths } = calculateSeniority(onboardDateStr);
      if (totalMonths < 6) return 0;
      if (totalMonths < 12) return 3 * 8;   // 6個月~1年: 3天
      if (totalMonths < 24) return 7 * 8;   // 1~2年: 7天
      if (totalMonths < 36) return 10 * 8;  // 2~3年: 10天
      if (totalMonths < 48) return 14 * 8;  // 3~4年: 14天
      if (totalMonths < 60) return 15 * 8;  // 4~5年: 15天
      const years = Math.floor(totalMonths / 12);
      const days = Math.min(15 + (years - 5), 30); // 5年以上每年+1天，最多30天
      return days * 8;
    }

    // =========================================================================
    // 3. 主應用程式組件
    // =========================================================================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('profile');

      // 全域資料庫狀態 (即時同步/本地Mock備用)
      const [usersList, setUsersList] = useState([
        { id: 'demo_admin', name: '系統管理員', title: '人事主管', gender: 'male', onboardDate: '2021-03-01', clockId: 'C1001', role: 'admin', lineUserId: 'U999888', compLeaveHours: 16 },
        { id: 'demo_user', name: '王小明', title: '專員', gender: 'male', onboardDate: '2023-01-15', clockId: 'C1002', role: 'staff', lineUserId: 'U123456', compLeaveHours: 8 }
      ]);
      const [leaveRequests, setLeaveRequests] = useState([
        { id: 'leave_1', userId: 'demo_user', userName: '王小明', date: '2026-10-10', dayOfWeek: '星期六', startTime: '09:00', endTime: '18:00', isFullDay: true, leaveType: '特休', hours: 8, status: 'approved', rejectionReason: '', cancelReason: '', approverName: '系統管理員', createdAt: new Date().toISOString() }
      ]);
      const [overtimeRequests, setOvertimeRequests] = useState([
        { id: 'ot_1', userId: 'demo_user', userName: '王小明', date: '2026-10-05', dayOfWeek: '星期一', planStart: '18:00', planEnd: '20:00', planHours: 2, preApprovalStatus: 'approved', preApproverName: '系統管理員', actualClockOut: '20:00', actualHours: 2, finalApprovalStatus: 'approved', finalApproverName: '系統管理員', rejectionReason: '', createdAt: new Date().toISOString() }
      ]);
      const [clockLogs, setClockLogs] = useState([]);

      // 監聽 Auth 狀態
      useEffect(() => {
        if (isFirebaseConfigured && auth) {
          const unsubscribe = auth.onAuthStateChanged(async (user) => {
            if (user) {
              setCurrentUser(user);
              fetchUserProfile(user.uid);
            } else {
              setCurrentUser(null);
              setUserProfile(null);
              setLoading(false);
            }
          });
          return () => unsubscribe();
        } else {
          // Firebase 未設定時預設可進入 Demo Mode
          setLoading(false);
        }
      }, []);

      // 取得個人 Profile 並設定 Firestore 即時監聽
      const fetchUserProfile = (uid) => {
        if (!db) return;
        db.collection('users').doc(uid).onSnapshot((doc) => {
          if (doc.exists) {
            setUserProfile({ id: doc.id, ...doc.data() });
          } else {
            const defaultProfile = {
              name: auth.currentUser?.displayName || '新員工',
              title: '專員',
              gender: 'male',
              onboardDate: new Date().toISOString().split('T')[0],
              clockId: 'C' + Math.floor(1000 + Math.random() * 9000),
              role: 'admin', // 預設提供最高權限方便測試
              lineUserId: '',
              compLeaveHours: 0
            };
            db.collection('users').doc(uid).set(defaultProfile);
            setUserProfile({ id: uid, ...defaultProfile });
          }
          setLoading(false);
        });
      };

      // 即時同步 Firestore 數據
      useEffect(() => {
        if (!isFirebaseConfigured || !userProfile || !db) return;

        const unsubUsers = db.collection('users').onSnapshot(snap => {
          setUsersList(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const unsubLeaves = db.collection('leave_requests').onSnapshot(snap => {
          const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setLeaveRequests(list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)));
        });

        const unsubOvertimes = db.collection('overtime_requests').onSnapshot(snap => {
          const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setOvertimeRequests(list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)));
        });

        const unsubClock = db.collection('clock_logs').onSnapshot(snap => {
          setClockLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        return () => {
          unsubUsers();
          unsubLeaves();
          unsubOvertimes();
          unsubClock();
        };
      }, [userProfile]);

      // 計算待審核數量 (供管理員視覺標籤提示)
      const pendingLeaveCount = useMemo(() => {
        return leaveRequests.filter(r => r.status === 'pending' || r.status === 'cancel_pending').length;
      }, [leaveRequests]);

      const pendingOvertimeCount = useMemo(() => {
        return overtimeRequests.filter(r => r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending').length;
      }, [overtimeRequests]);

      const totalPendingCount = pendingLeaveCount + pendingOvertimeCount;

      // Google 登入
      const handleLogin = async () => {
        if (!isFirebaseConfigured || !auth) {
          // 本地展示模式直接登入預設管理者
          const demoAdmin = usersList[0];
          setCurrentUser({ uid: demoAdmin.id, displayName: demoAdmin.name });
          setUserProfile(demoAdmin);
          return;
        }
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          await auth.signInWithPopup(provider);
        } catch (err) {
          alert('登入失敗: ' + err.message);
        }
      };

      // 示範模式快速切換身份
      const handleSwitchDemoRole = (role) => {
        const target = usersList.find(u => u.role === role) || usersList[0];
        setUserProfile({ ...target, role });
      };

      const handleLogout = () => {
        if (isFirebaseConfigured && auth) {
          auth.signOut();
        }
        setCurrentUser(null);
        setUserProfile(null);
      };

      if (loading) {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-100">
            <div className="text-center">
              <i className="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-3"></i>
              <p className="text-slate-600 font-medium">系統載入中，請稍候...</p>
            </div>
          </div>
        );
      }

      if (!currentUser || !userProfile) {
        return (
          <div className="flex min-h-screen items-center justify-center bg-slate-100 p-4">
            <div className="max-w-md w-full bg-white rounded-xl shadow-lg p-8 text-center border border-slate-200">
              <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i className="fa-solid fa-user-clock"></i>
              </div>
              <h2 className="text-2xl font-bold text-slate-800 mb-2">企業電子考勤系統</h2>
              <p className="text-slate-500 mb-6 text-sm">請登入以進行考勤打卡、請假與加班申請</p>
              
              {!isFirebaseConfigured && (
                <div className="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-lg text-left text-xs text-amber-800">
                  <p className="font-bold flex items-center gap-1 mb-1">
                    <i className="fa-solid fa-triangle-exclamation"></i> 目前為展示示範模式 (Demo Mode)
                  </p>
                  <p>尚未設定 Firebase 金鑰，點擊下方按鈕即可直接進入測試系統。</p>
                </div>
              )}

              <button 
                onClick={handleLogin}
                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-sm"
              >
                <i className={isFirebaseConfigured ? "fa-brands fa-google" : "fa-solid fa-right-to-bracket"}></i> 
                {isFirebaseConfigured ? "使用 Google 帳號登入" : "進入考勤系統 (Demo Mode)"}
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* 頂部導覽列 */}

            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <i className="fa-solid fa-clock-rotate-left text-blue-400 text-xl"></i>
                <span className="font-bold text-lg tracking-wide">考勤管理系統</span>
                <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${
                  userProfile.role === 'admin' ? 'bg-red-500 text-white' :
                  userProfile.role === 'delegated_admin' ? 'bg-amber-500 text-white' : 'bg-slate-700 text-slate-300'

                  {userProfile.role === 'admin' ? '系統管理者' : userProfile.role === 'delegated_admin' ? '授權管理員' : '行政人員'}
                </span>
              </div>
              <div className="flex items-center gap-4">
                {!isFirebaseConfigured && (
                  <div className="hidden sm:flex items-center gap-1 text-xs bg-slate-800 p-1 rounded border border-slate-700">
                    <span className="text-slate-400 pl-1">切換身分:</span>
                    <button onClick={() => handleSwitchDemoRole('admin')} className={`px-2 py-0.5 rounded ${userProfile.role==='admin'?'bg-blue-600 text-white':'text-slate-300'}`}>管理者</button>
                    <button onClick={() => handleSwitchDemoRole('staff')} className={`px-2 py-0.5 rounded ${userProfile.role==='staff'?'bg-blue-600 text-white':'text-slate-300'}`}>一般員工</button>
                  </div>
                )}
                <span className="text-sm text-slate-300 hidden md:inline">{userProfile.name} ({userProfile.title})</span>
                <button 
                  onClick={handleLogout}
                  className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded transition border border-slate-700"
                >
                  登出
                </button>
              </div>
            </div>
          </header>

          {/* 功能頁籤分頁 */}
          <nav className="bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 flex space-x-8 overflow-x-auto">
              <TabButton id="profile" icon="fa-user" label="個人資訊" activeTab={activeTab} setActiveTab={setActiveTab} />
              <TabButton id="leave" icon="fa-calendar-minus" label="請假申請" activeTab={activeTab} setActiveTab={setActiveTab} />
              <TabButton id="overtime" icon="fa-business-time" label="加班申請" activeTab={activeTab} setActiveTab={setActiveTab} />
              
              {(userProfile.role === 'admin' || userProfile.role === 'delegated_admin') && (
                <TabButton id="approval" icon="fa-clipboard-check" label="考勤審核" badgeCount={totalPendingCount} activeTab={activeTab} setActiveTab={setActiveTab} />
              )}
              
              {userProfile.role === 'admin' && (
                <TabButton id="admin" icon="fa-sliders" label="管理中心 (上傳/報表)" activeTab={activeTab} setActiveTab={setActiveTab} />
              )}
            </div>
          </nav>

          {/* 主內容區 */}
          <main className="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
            {activeTab === 'profile' && <ProfileView userProfile={userProfile} setUserProfile={setUserProfile} />}
            {activeTab === 'leave' && <LeaveView userProfile={userProfile} leaveRequests={leaveRequests} setLeaveRequests={setLeaveRequests} />}
            {activeTab === 'overtime' && <OvertimeView userProfile={userProfile} overtimeRequests={overtimeRequests} setOvertimeRequests={setOvertimeRequests} />}
            {activeTab === 'approval' && (userProfile.role === 'admin' || userProfile.role === 'delegated_admin') && (
              <ApprovalView userProfile={userProfile} leaveRequests={leaveRequests} setLeaveRequests={setLeaveRequests} overtimeRequests={overtimeRequests} setOvertimeRequests={setOvertimeRequests} usersList={usersList} setUsersList={setUsersList} />
            )}
            {activeTab === 'admin' && userProfile.role === 'admin' && (
              <AdminView usersList={usersList} leaveRequests={leaveRequests} overtimeRequests={overtimeRequests} clockLogs={clockLogs} setClockLogs={setClockLogs} />
            )}
          </main>
        </div>
      );
    }

    function TabButton({ id, icon, label, badgeCount = 0, activeTab, setActiveTab }) {
      const active = activeTab === id;
      return (
        <button
          onClick={() => setActiveTab(id)}
          className={`flex items-center gap-2 py-3 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors relative ${
            active ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
          }`}
        >
          <i className={`fa-solid ${icon}`}></i> {label}
          {badgeCount > 0 && (
            <span className="ml-1 px-1.5 py-0.5 text-xs font-bold bg-red-500 text-white rounded-full animate-pulse">
              {badgeCount}
            </span>
          )}
        </button>
      );
    }

    // =========================================================================
    // 4. 子頁面：個人資訊 (功能 2)
    // =========================================================================
    function ProfileView({ userProfile, setUserProfile }) {
      const [form, setForm] = useState({ ...userProfile });
      const [isSaving, setIsSaving] = useState(false);

      useEffect(() => {
        setForm({ ...userProfile });
      }, [userProfile]);

      const seniority = useMemo(() => calculateSeniority(userProfile.onboardDate), [userProfile.onboardDate]);
      const annualLeaveHours = useMemo(() => calculateAnnualLeaveHours(userProfile.onboardDate), [userProfile.onboardDate]);

      const handleSave = async (e) => {
        e.preventDefault();
        setIsSaving(true);
        try {
          if (isFirebaseConfigured && db) {
            await db.collection('users').doc(userProfile.id).update({
              name: form.name,
              title: form.title,
              gender: form.gender,
              onboardDate: form.onboardDate,
              clockId: form.clockId
            });
          }
          setUserProfile({ ...userProfile, ...form });
          alert('個人資料已成功更新！');
        } catch (err) {
          alert('更新失敗: ' + err.message);
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          {/* 特休/年資統計卡片 */}
          <div className="lg:col-span-1 space-y-4">
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i className="fa-solid fa-chart-pie text-blue-500"></i> 當前假期統計
              </h3>
              <div className="space-y-4">
                <div className="p-4 bg-slate-50 rounded-lg border border-slate-100">
                  <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">累計年資</span>
                  <div className="text-xl font-bold text-slate-800 mt-1">{seniority.str}</div>
                </div>
                <div className="p-4 bg-blue-50 rounded-lg border border-blue-100">
                  <span className="text-xs font-semibold text-blue-600 uppercase tracking-wider">依法應有特休時數</span>
                  <div className="text-2xl font-black text-blue-700 mt-1">{annualLeaveHours} <span className="text-sm font-normal">小時</span></div>
                  <span className="text-xs text-blue-500">({(annualLeaveHours / 8).toFixed(1)} 天)</span>
                </div>
                <div className="p-4 bg-emerald-50 rounded-lg border border-emerald-100">
                  <span className="text-xs font-semibold text-emerald-600 uppercase tracking-wider">可用補休時數</span>
                  <div className="text-2xl font-black text-emerald-700 mt-1">{userProfile.compLeaveHours || 0} <span className="text-sm font-normal">小時</span></div>
                </div>
              </div>
            </div>
          </div>

          {/* 個人資料編輯表單 (取消 LINE ID 欄位) */}
          <div className="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-id-card text-blue-500"></i> 基本資料設定
            </h3>
            <form onSubmit={handleSave} className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">姓名</label>
                  <input type="text" required value={form.name || ''} onChange={e => setForm({...form, name: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">職稱</label>
                  <input type="text" required value={form.title || ''} onChange={e => setForm({...form, title: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">性別</label>
                  <select value={form.gender || 'male'} onChange={e => setForm({...form, gender: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="male">男性</option>
                    <option value="female">女性</option>
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">入職日期</label>
                  <input type="date" required value={form.onboardDate || ''} onChange={e => setForm({...form, onboardDate: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
                <div className="md:col-span-2">
                  <label className="block text-sm font-medium text-slate-700 mb-1">打卡機代號</label>
                  <input type="text" required value={form.clockId || ''} onChange={e => setForm({...form, clockId: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
              </div>
              <div className="pt-4 flex justify-end">
                <button type="submit" disabled={isSaving} className="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition shadow-sm">
                  {isSaving ? '儲存中...' : '儲存變更'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 5. 子頁面：請假功能 (功能 3, 4)
    // =========================================================================
    function LeaveView({ userProfile, leaveRequests, setLeaveRequests }) {
      const myRequests = leaveRequests.filter(r => r.userId === userProfile.id);

      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [isFullDay, setIsFullDay] = useState(false);
      const [startTime, setStartTime] = useState('09:00');
      const [endTime, setEndTime] = useState('18:00');
      const [leaveType, setLeaveType] = useState('特休');
      const [cancelModalItem, setCancelModalItem] = useState(null);
      const [cancelReason, setCancelReason] = useState('');

      const dayOfWeek = useMemo(() => getDayOfWeekStr(date), [date]);

      const calculatedHours = useMemo(() => {
        if (isFullDay) return 8;
        const startH = parseInt(startTime.split(':')[0]);
        const endH = parseInt(endTime.split(':')[0]);
        let diff = endH - startH;
        if (startH <= 12 && endH >= 13) diff -= 1;
        return diff > 0 ? diff : 0;
      }, [isFullDay, startTime, endTime]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (calculatedHours <= 0) {
          alert('請假起訖時間選擇不正確！');
          return;
        }

        const newReq = {
          id: 'leave_' + Date.now(),
          userId: userProfile.id,
          userName: userProfile.name,
          date,
          dayOfWeek,
          startTime: isFullDay ? '09:00' : startTime,
          endTime: isFullDay ? '18:00' : endTime,
          isFullDay,
          leaveType,
          hours: calculatedHours,
          status: 'pending',
          rejectionReason: '',
          cancelReason: '',
          approverName: '',
          createdAt: new Date().toISOString()
        };

        try {
          if (isFirebaseConfigured && db) {
            await db.collection('leave_requests').add(newReq);
          } else {
            setLeaveRequests([newReq, ...leaveRequests]);
          }
          // 發送 LINE 通知給管理員
          sendLineAdminNotification("新請假申請", `${userProfile.name} 申請 ${date} ${leaveType} (${calculatedHours}小時)`);
          alert('請假申請已送出！已發送通知給管理人員。');
        } catch (err) {
          alert('送出失敗: ' + err.message);
        }
      };

      const handleResubmit = async (req) => {
        try {
          if (isFirebaseConfigured && db) {
            await db.collection('leave_requests').doc(req.id).update({
              status: 'pending',
              rejectionReason: '',
              createdAt: new Date().toISOString()
            });
          } else {
            setLeaveRequests(leaveRequests.map(r => r.id === req.id ? { ...r, status: 'pending', rejectionReason: '' } : r));
          }
          alert('已重新送出審核！');
        } catch (err) {
          alert('操作失敗: ' + err.message);
        }
      };

      const handleCancelSubmit = async () => {
        if (!cancelReason) return alert('請填寫銷假原因！');
        try {
          if (isFirebaseConfigured && db) {
            await db.collection('leave_requests').doc(cancelModalItem.id).update({
              status: 'cancel_pending',
              cancelReason
            });
          } else {
            setLeaveRequests(leaveRequests.map(r => r.id === cancelModalItem.id ? { ...r, status: 'cancel_pending', cancelReason } : r));
          }
          alert('銷假申請已送出審核！');
          setCancelModalItem(null);
          setCancelReason('');
        } catch (err) {
          alert('送出失敗: ' + err.message);
        }
      };

      return (
        <div className="space-y-6">
          {/* 請假申請表單 */}
          <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-file-pen text-blue-500"></i> 新增請假申請
            </h3>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">申請人姓名</label>
                  <input type="text" disabled value={userProfile.name} className="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-lg text-slate-600" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">請假日期</label>
                  <div className="flex items-center gap-2">
                    <input type="date" required value={date} onChange={e => setDate(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    <span className="text-sm font-bold text-blue-600 whitespace-nowrap min-w-[60px]">{dayOfWeek}</span>
                  </div>
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">假別</label>
                  <select value={leaveType} onChange={e => setLeaveType(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="特休">特休</option>
                    <option value="補休">補休</option>
                    <option value="事假">事假</option>
                    <option value="喪假">喪假</option>
                    <option value="婚假">婚假</option>
                    {userProfile.gender === 'female' && <option value="生理假">生理假 (女性專屬)</option>}
                  </select>
                </div>
              </div>

              {/* 時間選擇 */}
              <div className="flex items-center gap-4 pt-2">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={isFullDay} onChange={e => setIsFullDay(e.target.checked)} className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500" />
                  <span className="text-sm font-semibold text-slate-700">全日 (8小時)</span>
                </label>
              </div>

              {!isFullDay && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">開始時間 (09:00 - 18:00)</label>
                    <select value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg">
                      {['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'].map(t => (
                        <option key={t} value={t}>{t}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">結束時間 (09:00 - 18:00)</label>
                    <select value={endTime} onChange={e => setEndTime(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg">
                      {['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'].map(t => (
                        <option key={t} value={t}>{t}</option>
                      ))}
                    </select>
                  </div>
                </div>
              )}

              <div className="flex justify-between items-center pt-2">
                <div className="text-sm font-medium text-slate-600">
                  預計扣除/請假時數: <span className="text-lg font-bold text-blue-600">{calculatedHours}</span> 小時
                </div>
                <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition shadow-sm">
                  送出請假申請
                </button>
              </div>
            </form>
          </div>

          {/* 請假紀錄列表 */}
          <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-clock-rotate-left text-blue-500"></i> 我的請假紀錄
            </h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm text-slate-600">
                <thead className="bg-slate-50 text-slate-700 uppercase font-semibold text-xs border-b border-slate-200">
                  <tr>
                    <th className="py-3 px-4">日期 (星期)</th>
                    <th className="py-3 px-4">時段</th>
                    <th className="py-3 px-4">假別</th>
                    <th className="py-3 px-4">時數</th>
                    <th className="py-3 px-4">核准狀態</th>
                    <th className="py-3 px-4">核准人</th>
                    <th className="py-3 px-4 text-right">操作</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {myRequests.length === 0 ? (
                    <tr><td colSpan="7" className="text-center py-6 text-slate-400">尚無請假紀錄</td></tr>
                  ) : myRequests.map(req => (
                    <tr key={req.id} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-medium">{req.date} ({req.dayOfWeek})</td>
                      <td className="py-3 px-4">{req.isFullDay ? '全日' : `${req.startTime} ~ ${req.endTime}`}</td>
                      <td className="py-3 px-4"><span className="px-2 py-0.5 bg-slate-100 rounded text-slate-700">{req.leaveType}</span></td>
                      <td className="py-3 px-4 font-bold">{req.hours} h</td>
                      <td className="py-3 px-4">
                        <StatusBadge status={req.status} />
                        {req.status === 'rejected' && <p className="text-xs text-red-500 mt-1">原因: {req.rejectionReason}</p>}
                      </td>
                      <td className="py-3 px-4 text-slate-500">{req.approverName || '-'}</td>
                      <td className="py-3 px-4 text-right">
                        {req.status === 'rejected' && (
                          <button onClick={() => handleResubmit(req)} className="text-xs bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded">修改重送</button>
                        )}
                        {req.status === 'approved' && (
                          <button onClick={() => setCancelModalItem(req)} className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1 rounded">申請銷假</button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* 銷假 Modal */}
          {cancelModalItem && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
                <h4 className="font-bold text-slate-800 text-lg">申請銷假</h4>
                <p className="text-sm text-slate-600">日期：{cancelModalItem.date} ({cancelModalItem.hours}小時 {cancelModalItem.leaveType})</p>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">銷假原因</label>
                  <textarea rows="3" value={cancelReason} onChange={e => setCancelReason(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="請說明銷假原因..."></textarea>
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setCancelModalItem(null)} className="px-4 py-2 border border-slate-300 rounded-lg text-slate-600">取消</button>
                  <button onClick={handleCancelSubmit} className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">送出銷假申請</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 6. 子頁面：加班功能 (功能 5 兩階段加班)
    // =========================================================================

      const dayOfWeek = useMemo(() => getDayOfWeekStr(date), [date]);

      const handlePlanSubmit = async (e) => {
        e.preventDefault();
        const newOt = {
          id: 'ot_' + Date.now(),
          userId: userProfile.id,
          userName: userProfile.name,
          date,
          dayOfWeek,
          planStart,
          planEnd,
          planHours: Number(planHours),
          preApprovalStatus: 'pending',
          preApproverName: '',
          actualClockOut: '',
          actualHours: 0,
          finalApprovalStatus: 'none',
          finalApproverName: '',
          rejectionReason: '',
          createdAt: new Date().toISOString()
        };

        try {
          if (isFirebaseConfigured && db) {
            await db.collection('overtime_requests').add(newOt);
          } else {
            setOvertimeRequests([newOt, ...overtimeRequests]);
          }
          alert('加班預先申請已送出！');
        } catch (err) {
          alert('送出失敗: ' + err.message);
        }
      };

      const handleActualSubmit = async () => {
        try {
          if (isFirebaseConfigured && db) {
            await db.collection('overtime_requests').doc(actualModalItem.id).update({
              actualClockOut,
              actualHours: Number(actualHours),
              finalApprovalStatus: 'pending'
            });

            setOvertimeRequests(overtimeRequests.map(r => r.id === actualModalItem.id ? { ...r, actualClockOut, actualHours: Number(actualHours), finalApprovalStatus: 'pending' } : r));

                    <span className="text-xs font-bold text-blue-600">{dayOfWeek}</span>

                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">預計起時</label>

                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">預計迄時</label>
                  <input type="time" required value={planEnd} onChange={e => setPlanEnd(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">預計時數 (小時)</label>
                  <input type="number" step="0.5" min="0.5" required value={planHours} onChange={e => setPlanHours(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg" />
                </div>

              <div className="flex justify-end pt-2">
                <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition shadow-sm">
                  送出預審申請

    // =========================================================================
    // 7. 子頁面：考勤審核 (功能 6, 7)
    // =========================================================================
    function ApprovalView({ userProfile, leaveRequests, setLeaveRequests, overtimeRequests, setOvertimeRequests, usersList, setUsersList }) {
      const [rejectModal, setRejectModal] = useState(null);
      const [rejectionReason, setRejectionReason] = useState('');

      const pendingLeaves = leaveRequests.filter(r => r.status === 'pending' || r.status === 'cancel_pending');
      const pendingOvertimes = overtimeRequests.filter(r => r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending');
      const totalPending = pendingLeaves.length + pendingOvertimes.length;

      const handleApproveLeave = async (req, isCancel = false) => {
        try {
          const newStatus = isCancel ? 'cancelled' : 'approved';
          if (isFirebaseConfigured && db) {
            await db.collection('leave_requests').doc(req.id).update({
              status: newStatus,
              approverName: userProfile.name
            });
            if (newStatus === 'approved' && req.leaveType === '補休') {
              const targetUser = usersList.find(u => u.id === req.userId);
              const currentComp = targetUser?.compLeaveHours || 0;
              await db.collection('users').doc(req.userId).update({ compLeaveHours: Math.max(0, currentComp - req.hours) });
            }
          } else {
            setLeaveRequests(leaveRequests.map(r => r.id === req.id ? { ...r, status: newStatus, approverName: userProfile.name } : r));
            if (newStatus === 'approved' && req.leaveType === '補休') {
              setUsersList(usersList.map(u => u.id === req.userId ? { ...u, compLeaveHours: Math.max(0, (u.compLeaveHours || 0) - req.hours) } : u));
            }
          }
          alert('已核准！');
        } catch (err) {
          alert('操作失敗: ' + err.message);
        }
      };

      const handleApproveOvertime = async (req, stage) => {
        try {
          if (stage === 'pre') {
            if (isFirebaseConfigured && db) {
              await db.collection('overtime_requests').doc(req.id).update({
                preApprovalStatus: 'approved',
                preApproverName: userProfile.name
              });
            } else {
              setOvertimeRequests(overtimeRequests.map(r => r.id === req.id ? { ...r, preApprovalStatus: 'approved', preApproverName: userProfile.name } : r));
            }
          } else {
            const addHours = req.actualHours || req.planHours;
            if (isFirebaseConfigured && db) {
              await db.collection('overtime_requests').doc(req.id).update({
                finalApprovalStatus: 'approved',
                finalApproverName: userProfile.name
              });
              const targetUser = usersList.find(u => u.id === req.userId);
              const currentComp = targetUser?.compLeaveHours || 0;
              await db.collection('users').doc(req.userId).update({ compLeaveHours: currentComp + addHours });
            } else {
              setOvertimeRequests(overtimeRequests.map(r => r.id === req.id ? { ...r, finalApprovalStatus: 'approved', finalApproverName: userProfile.name } : r));
              setUsersList(usersList.map(u => u.id === req.userId ? { ...u, compLeaveHours: (u.compLeaveHours || 0) + addHours } : u));
            }
          }
          alert('核准成功！');
        } catch (err) {
          alert('操作失敗: ' + err.message);
        }
      };

      const handleRejectSubmit = async () => {
        if (!rejectionReason) return alert('請填寫駁回原因！');
        const { type, item } = rejectModal;
        try {
          if (type === 'leave') {
            if (isFirebaseConfigured && db) {
              await db.collection('leave_requests').doc(item.id).update({
                status: 'rejected',
                rejectionReason,
                approverName: userProfile.name
              });
            } else {
              setLeaveRequests(leaveRequests.map(r => r.id === item.id ? { ...r, status: 'rejected', rejectionReason, approverName: userProfile.name } : r));
            }
          } else if (type === 'ot_pre') {
            if (isFirebaseConfigured && db) {
              await db.collection('overtime_requests').doc(item.id).update({
                preApprovalStatus: 'rejected',
                rejectionReason,
                preApproverName: userProfile.name
              });
            } else {
              setOvertimeRequests(overtimeRequests.map(r => r.id === item.id ? { ...r, preApprovalStatus: 'rejected', rejectionReason, preApproverName: userProfile.name } : r));
            }
          } else if (type === 'ot_final') {
            if (isFirebaseConfigured && db) {
              await db.collection('overtime_requests').doc(item.id).update({
                finalApprovalStatus: 'rejected',
                rejectionReason,
                finalApproverName: userProfile.name
              });
            } else {
              setOvertimeRequests(overtimeRequests.map(r => r.id === item.id ? { ...r, finalApprovalStatus: 'rejected', rejectionReason, finalApproverName: userProfile.name } : r));
            }
          }
          alert('已駁回！');
          setRejectModal(null);
          setRejectionReason('');
        } catch (err) {
          alert('操作失敗: ' + err.message);
        }
      };

      return (
        <div className="space-y-6">
          {/* 管理員提醒 Banner */}
          <div className={`p-4 rounded-xl border flex items-center justify-between ${totalPending > 0 ? 'bg-amber-50 border-amber-200 text-amber-900' : 'bg-emerald-50 border-emerald-200 text-emerald-900'}`}>
            <div className="flex items-center gap-3">
              <i className={`fa-solid ${totalPending > 0 ? 'fa-bell text-amber-600 text-xl animate-bounce' : 'fa-circle-check text-emerald-600 text-xl'}`}></i>
              <div>
                <span className="font-bold">{totalPending > 0 ? `尚有 ${totalPending} 筆待審核項目` : '目前所有單據皆已審核完成'}</span>
                <p className="text-xs opacity-80 mt-0.5">系統會自動追蹤紀錄並發送 LINE 通知提醒管理人員。</p>
              </div>
            </div>
            {totalPending > 0 && (
              <span className="text-xs font-semibold bg-amber-200 text-amber-900 px-3 py-1 rounded-full">
                需即時處理
              </span>
            )}
          </div>

          {/* 請假/銷假待審核單據 */}
          <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-envelope-open-text text-amber-500"></i> 待審核請假/銷假單據
            </h3>
            <div className="space-y-3">
              {leaveRequests.filter(r => r.status === 'pending' || r.status === 'cancel_pending').length === 0 ? (
                <p className="text-slate-400 text-sm text-center py-4">目前無待處理請假申請</p>
              ) : (
                leaveRequests.filter(r => r.status === 'pending' || r.status === 'cancel_pending').map(req => (
                  <div key={req.id} className="p-4 bg-slate-50 border border-slate-200 rounded-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-slate-800">{req.userName}</span>
                        <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">{req.leaveType}</span>
                        <span className="text-xs font-semibold text-slate-500">{req.hours} 小時</span>
                        {req.status === 'cancel_pending' && <span className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold">申請銷假中</span>}
                      </div>
                      <p className="text-xs text-slate-500 mt-1">日期：{req.date} ({req.dayOfWeek}) {req.isFullDay ? '全日' : `${req.startTime}~${req.endTime}`}</p>
                      {req.cancelReason && <p className="text-xs text-red-600 mt-1">銷假原因：{req.cancelReason}</p>}
                    </div>
                    <div className="flex items-center gap-2 self-end md:self-auto">
                      <button onClick={() => handleApproveLeave(req, req.status === 'cancel_pending')} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded">
                        <i className="fa-solid fa-check mr-1"></i> 核准
                      </button>
                      <button onClick={() => setRejectModal({ type: 'leave', item: req })} className="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-1.5 rounded">
                        <i className="fa-solid fa-xmark mr-1"></i> 駁回
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* 加班待審核單據 (預審與複審) */}
          <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-business-time text-indigo-500"></i> 待審核加班單據 (兩階段)
            </h3>
            <div className="space-y-3">
              {overtimeRequests.filter(r => r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending').length === 0 ? (
                <p className="text-slate-400 text-sm text-center py-4">目前無待處理加班申請</p>
              ) : (
                overtimeRequests.filter(r => r.preApprovalStatus === 'pending' || r.finalApprovalStatus === 'pending').map(req => {
                  const isPre = req.preApprovalStatus === 'pending';
                  return (
                    <div key={req.id} className="p-4 bg-slate-50 border border-slate-200 rounded-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-800">{req.userName}</span>
                          <span className={`text-xs px-2 py-0.5 rounded font-semibold ${isPre ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                            {isPre ? '第一階段 (預審)' : '第二階段 (複審)'}
                          </span>
                        </div>
                        <p className="text-xs text-slate-500 mt-1">
                          日期：{req.date} ({req.dayOfWeek}) | 預計：{req.planStart}~{req.planEnd} ({req.planHours}h)
                          {!isPre && <span className="text-slate-800 font-bold ml-2">實際下班：{req.actualClockOut} ({req.actualHours}h)</span>}
                        </p>
                      </div>
                      <div className="flex items-center gap-2 self-end md:self-auto">
                        <button onClick={() => handleApproveOvertime(req, isPre ? 'pre' : 'final')} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded">
                          <i className="fa-solid fa-check mr-1"></i> 核准
                        </button>
                        <button onClick={() => setRejectModal({ type: isPre ? 'ot_pre' : 'ot_final', item: req })} className="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-1.5 rounded">
                          <i className="fa-solid fa-xmark mr-1"></i> 駁回
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>

          {/* 駁回 Reason Modal */}
          {rejectModal && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
                <h4 className="font-bold text-slate-800 text-lg">退回/駁回申請</h4>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">請輸入駁回原因 (申請人可修改後重新送出)</label>
                  <textarea rows="3" value={rejectionReason} onChange={e => setRejectionReason(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="說明駁回原因..."></textarea>
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setRejectModal(null)} className="px-4 py-2 border border-slate-300 rounded-lg text-slate-600">取消</button>
                  <button onClick={handleRejectSubmit} className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">確定駁回</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 8. 子頁面：管理者頁面 (打卡記錄上傳 + Excel 匯出) (功能 8, 9)
    // =========================================================================
    function AdminView({ usersList, leaveRequests, overtimeRequests, clockLogs, setClockLogs }) {
      const [selectedMonth, setSelectedMonth] = useState('2026-10');
      const [uploading, setUploading] = useState(false);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setUploading(true);
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            if (isFirebaseConfigured && db) {
              await db.collection('clock_logs').doc(selectedMonth).set({
                month: selectedMonth,
                logs: jsonData,
                updatedAt: new Date().toISOString()
              });
            } else {
              setClockLogs([...clockLogs.filter(c => c.month !== selectedMonth), { month: selectedMonth, logs: jsonData }]);
            }

            alert(`月份 ${selectedMonth} 的打卡紀錄匯入成功！共 ${jsonData.length} 筆`);
          } catch (err) {
            alert('解析或匯入失敗: ' + err.message);
          } finally {
            setUploading(false);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const handleExportExcel = () => {
        const wb = XLSX.utils.book_new();

        // 1. 全公司彙整總表 Sheet
        const summaryData = usersList.map(u => {
          const uLeaves = leaveRequests.filter(r => r.userId === u.id && r.status === 'approved' && r.date.startsWith(selectedMonth));
          const uOT = overtimeRequests.filter(r => r.userId === u.id && r.finalApprovalStatus === 'approved' && r.date.startsWith(selectedMonth));
          
          const leaveHours = uLeaves.reduce((acc, r) => acc + r.hours, 0);
          const otHours = uOT.reduce((acc, r) => acc + (r.actualHours || r.planHours), 0);

          return {
            '打卡代號': u.clockId,
            '姓名': u.name,
            '職稱': u.title,
            '當月請假總時數': leaveHours,
            '當月加班總時數': otHours,
            '當前剩餘特休時數': calculateAnnualLeaveHours(u.onboardDate),
            '當前剩餘補休時數': u.compLeaveHours || 0
          };
        });
        const summaryWs = XLSX.utils.json_to_sheet(summaryData);
        XLSX.utils.book_append_sheet(wb, summaryWs, "全公司統計總表");

        // 2. 各使用者獨立分頁 Sheet
        usersList.forEach(u => {
          const uLeaves = leaveRequests.filter(r => r.userId === u.id && r.status === 'approved' && r.date.startsWith(selectedMonth));
          const uOT = overtimeRequests.filter(r => r.userId === u.id && r.finalApprovalStatus === 'approved' && r.date.startsWith(selectedMonth));

          const sheetRows = [];
          sheetRows.push({ A: `員工姓名: ${u.name}`, B: `職稱: ${u.title}`, C: `打卡機代號: ${u.clockId}` });
          sheetRows.push({ A: `結算特休時數: ${calculateAnnualLeaveHours(u.onboardDate)}`, B: `結算補休時數: ${u.compLeaveHours || 0}` });
          sheetRows.push({});
          sheetRows.push({ A: '日期', B: '假別/出勤項目', C: '時數', D: '狀態', E: '備註' });

          uLeaves.forEach(l => {
            sheetRows.push({ A: l.date, B: `請假: ${l.leaveType}`, C: l.hours, D: '已核准', E: l.isFullDay ? '全日' : `${l.startTime}~${l.endTime}` });
          });
          uOT.forEach(o => {
            sheetRows.push({ A: o.date, B: '加班報銷', C: o.actualHours || o.planHours, D: '已核准', E: `實際下班 ${o.actualClockOut}` });
          });

          const userWs = XLSX.utils.json_to_sheet(sheetRows, { skipHeader: true });
          const sheetName = `${u.clockId}_${u.name}`.substring(0, 31);
          XLSX.utils.book_append_sheet(wb, userWs, sheetName);
        });

        XLSX.writeFile(wb, `公司月度考勤結算表_${selectedMonth}.xlsx`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i className="fa-solid fa-file-excel text-emerald-600"></i> 月份考勤上傳與報表產生
            </h3>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {/* 左邊：上傳考勤紀錄 */}
              <div className="p-4 bg-slate-50 border border-slate-200 rounded-lg space-y-3">
                <h4 className="font-bold text-slate-700 text-sm">1. 上傳當月打卡機紀錄</h4>
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">選擇考勤月份</label>
                  <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="px-3 py-1.5 border border-slate-300 rounded text-sm w-full" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">上傳 Excel/CSV 檔案 (需包含: 打卡代號、日期、簽到/簽退)</label>
                  <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} disabled={uploading} className="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                </div>
              </div>

              {/* 右邊：一鍵匯出 Excel */}
              <div className="p-4 bg-blue-50 border border-blue-100 rounded-lg flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-blue-900 text-sm">2. 產生當月 Excel 報表</h4>
                  <p className="text-xs text-blue-700 mt-1">系統將根據考勤數據、核准之請假與加班紀錄，自動為每位使用者獨立製作 Excel 分頁，並算清剩餘特休與補休時數。</p>
                </div>
                <button onClick={handleExportExcel} className="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-lg transition shadow flex items-center justify-center gap-2">
                  <i className="fa-solid fa-download"></i> 一鍵匯出全公司 `.xlsx` 報表
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 狀態標籤 Component
    function StatusBadge({ status }) {
      const config = {
        pending: { label: '待審核', class: 'bg-amber-100 text-amber-800' },
        approved: { label: '已核准', class: 'bg-emerald-100 text-emerald-800' },
        rejected: { label: '已被駁回', class: 'bg-red-100 text-red-800' },
        cancel_pending: { label: '銷假待審', class: 'bg-purple-100 text-purple-800' },
        cancelled: { label: '已銷假', class: 'bg-slate-200 text-slate-700' }
      };
      const conf = config[status] || { label: status, class: 'bg-slate-100 text-slate-800' };
      return <span className={`text-xs font-semibold px-2 py-0.5 rounded ${conf.class}`}>{conf.label}</span>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
